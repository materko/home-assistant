# Poschodia a miestnosti (area/floor registry)
# Export z Home Assistant — read-only snapshot, needí sa priamo do /config

floors:
  - floor_id: poschodie
    name: Poschodie
    level: null
    areas:
      - { area_id: living_room,        name: Living Room,          icon: "mdi:sofa" }
      - { area_id: kitchen,            name: Kitchen,              icon: "mdi:stove" }
      - { area_id: bedroom,            name: Bedroom,              icon: "mdi:bed" }
      - { area_id: technicka_miestnost, name: Technicka miestnost, icon: null }
      - { area_id: bathroom_down,      name: Bathroom down,        icon: "mdi:bathtub-outline" }
      - { area_id: bedroom_ena,        name: Bedroom Ena,          icon: "mdi:bed" }
      - { area_id: bedroom_mato,       name: Bedroom Mato,         icon: "mdi:bed-outline" }
      - { area_id: bazen,              name: Bazen,                icon: "mdi:pool-thermometer" }
      - { area_id: zahrada,            name: Zahrada,              icon: "mdi:shovel" }
      - { area_id: chodba_hore,        name: Chodba hore,          icon: "mdi:stairs" }
      - { area_id: bathroom_up,        name: Bathroom up,          icon: "mdi:bathtub" }

  - floor_id: prizemie
    name: Prizemie
    level: 0
    areas:
      - { area_id: vstupna_chodba,     name: Vstupna chodba,       icon: "mdi:stairs" }

unassigned_areas: []
orphaned_areas: []
