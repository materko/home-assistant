bazen_svetlo_on:
  alias: Bazen Svetlo On
  description: Zapne LED osvetlenie bazéna (RS485 príkaz PL1) a nastaví odhadovaný
    stav. Ovládač, tlačidlo 1 single.
  icon: mdi:led-strip-variant
  mode: single
  sequence:
  - action: text.set_value
    alias: Poslat prikaz PL1
    data:
      value: PL1
    target:
      entity_id: text.bazen_atoms3_light_pool_rs485_command
  - action: input_boolean.turn_on
    alias: Oznacit svetlo ako zapnute
    target:
      entity_id: input_boolean.bazen_led_svetlo
bazen_svetlo_off:
  alias: Bazen Svetlo Off
  description: Vypne LED osvetlenie bazéna (RS485 príkaz PL0) a nastaví odhadovaný
    stav. Ovládač, tlačidlo 1 double.
  icon: mdi:led-strip-variant-off
  mode: single
  sequence:
  - action: text.set_value
    alias: Poslat prikaz PL0
    data:
      value: PL0
    target:
      entity_id: text.bazen_atoms3_light_pool_rs485_command
  - action: input_boolean.turn_off
    alias: Oznacit svetlo ako vypnute
    target:
      entity_id: input_boolean.bazen_led_svetlo
futura_nastavit_dovolenku:
  alias: Futura – nastaviť dovolenku
  description: Odošle termín z helperov 'Futura dovolenka od/do' do služby jablotron_futura.set_away
    a zavrie editor. Ak je koniec skorší alebo rovný začiatku, akciu zastaví a editor
    nechá otvorený.
  icon: mdi:beach
  mode: single
  sequence:
  - alias: Koniec musí byť po začiatku
    condition: template
    value_template: '{{ as_timestamp(states(''input_datetime.futura_dovolenka_do''),
      0) > as_timestamp(states(''input_datetime.futura_dovolenka_od''), 0) }}'
  - action: jablotron_futura.set_away
    alias: Zapísať termín do jednotky
    data:
      begin: '{{ states(''input_datetime.futura_dovolenka_od'') }}'
      end: '{{ states(''input_datetime.futura_dovolenka_do'') }}'
  - action: input_boolean.turn_off
    alias: Zavrieť editor
    target:
      entity_id: input_boolean.futura_dovolenka_editor
bazen_svetlo_dalsi_program:
  alias: Bazen Svetlo Dalsi program
  description: Posunie osvetlenie bazéna na ďalší program (RS485 príkaz PsU). Volané
    z ovládača, tlačidlo 3 single.
  icon: mdi:palette
  mode: single
  sequence:
  - action: text.set_value
    alias: Poslat prikaz PsU
    data:
      value: PsU
    target:
      entity_id: text.bazen_atoms3_light_pool_rs485_command
bazen_trysky_on:
  alias: Bazen Trysky ON
  description: Zapne wellness trysky (RS485 príkaz PRA1) a nastaví odhadovaný stav.
    Ovládač, tlačidlo 2 single.
  icon: mdi:waves
  mode: single
  sequence:
  - action: text.set_value
    alias: Poslat prikaz PRA1
    data:
      value: PRA1
    target:
      entity_id: text.bazen_atoms3_light_pool_rs485_command
  - action: input_boolean.turn_on
    alias: Oznacit trysky ako zapnute
    target:
      entity_id: input_boolean.bazen_wellness_trysky
bazen_trysky_off:
  alias: Bazen Trysky OFF
  description: Vypne wellness trysky (RS485 príkaz PRA0) a nastaví odhadovaný stav.
    Ovládač, tlačidlo 2 double.
  icon: mdi:waves-arrow-right
  mode: single
  sequence:
  - action: text.set_value
    alias: Poslat prikaz PRA0
    data:
      value: PRA0
    target:
      entity_id: text.bazen_atoms3_light_pool_rs485_command
  - action: input_boolean.turn_off
    alias: Oznacit trysky ako vypnute
    target:
      entity_id: input_boolean.bazen_wellness_trysky
bazen_vsetko_off:
  alias: Bazen Vsetko OFF
  description: Vypne svetlá aj trysky (PL0 a PRA0 s odstupom 300 ms) a nastaví odhadovaný
    stav oboch. Ovládač, tlačidlo 4 single.
  icon: mdi:power-off
  mode: single
  sequence:
  - action: text.set_value
    alias: Vypnut svetla (PL0)
    data:
      value: PL0
    target:
      entity_id: text.bazen_atoms3_light_pool_rs485_command
  - alias: Pauza medzi prikazmi
    delay:
      hours: 0
      milliseconds: 300
      minutes: 0
      seconds: 0
  - action: text.set_value
    alias: Vypnut trysky (PRA0)
    data:
      value: PRA0
    target:
      entity_id: text.bazen_atoms3_light_pool_rs485_command
  - action: input_boolean.turn_off
    alias: Oznacit oboje ako vypnute
    target:
      entity_id:
      - input_boolean.bazen_led_svetlo
      - input_boolean.bazen_wellness_trysky
bazen_svetlo_toggle:
  alias: Bazen Svetlo Toggle
  description: Prepne LED osvetlenie bazéna podľa odhadovaného stavu — ak svieti,
    zavolá Svetlo Off, inak Svetlo On.
  icon: mdi:led-strip-variant
  mode: single
  sequence:
  - alias: Prepnut podla aktualneho stavu
    else:
    - action: script.bazen_svetlo_on
    if:
    - condition: state
      entity_id: input_boolean.bazen_led_svetlo
      state: 'on'
    then:
    - action: script.bazen_svetlo_off
bazen_trysky_toggle:
  alias: Bazen Trysky Toggle
  description: Prepne wellness trysky podľa odhadovaného stavu — ak bežia, zavolá
    Trysky OFF, inak Trysky ON.
  icon: mdi:waves
  mode: single
  sequence:
  - alias: Prepnut podla aktualneho stavu
    else:
    - action: script.bazen_trysky_on
    if:
    - condition: state
      entity_id: input_boolean.bazen_wellness_trysky
      state: 'on'
    then:
    - action: script.bazen_trysky_off
bazen_doplnil_som_ph_minus:
  alias: Bazen – doplniť pH minus
  description: Zapíše zadaný obsah kanistra pH− a vynuluje počítadlo spotreby v jednotke
    Aseko. Spúšťa sa z dashboardu — klepnutie otvorí dialóg s políčkom na počet litrov.
  fields:
    litre:
      description: Kolko litrov je v kanistri po dopleni.
      name: Obsah kanistra (L)
      required: true
      selector:
        number:
          max: 60
          min: 0
          mode: box
          step: 0.5
          unit_of_measurement: L
  icon: mdi:beaker-plus
  mode: single
  sequence:
  - action: input_number.set_value
    alias: Zapisat obsah kanistra
    data:
      value: '{{ litre | float(0) }}'
    target:
      entity_id: input_number.bazen_ph_minus_objem_kanistra
  - action: button.press
    alias: Vynulovat pocitadlo spotreby pH minus
    target:
      entity_id: button.bazen_aseko_asin_aqua_salt_110195262_ph_refill
bazen_doplnil_som_algicid:
  alias: Bazen – doplniť algicíd
  description: Zapíše zadaný obsah kanistra algicídu a vynuluje počítadlo spotreby
    v jednotke Aseko. Spúšťa sa z dashboardu — klepnutie otvorí dialóg s políčkom
    na počet litrov.
  fields:
    litre:
      description: Kolko litrov je v kanistri po dopleni.
      name: Obsah kanistra (L)
      required: true
      selector:
        number:
          max: 60
          min: 0
          mode: box
          step: 0.5
          unit_of_measurement: L
  icon: mdi:beaker-plus
  mode: single
  sequence:
  - action: input_number.set_value
    alias: Zapisat obsah kanistra
    data:
      value: '{{ litre | float(0) }}'
    target:
      entity_id: input_number.bazen_algicid_objem_kanistra
  - action: button.press
    alias: Vynulovat pocitadlo spotreby algicidu
    target:
      entity_id: button.bazen_aseko_asin_aqua_salt_110195262_algicide_refill
pusti_radio:
  alias: Pustiť rádio
  description: Spustí živé vysielanie rozhlasovej stanice na Sonos reproduktore cez
    Music Assistant. Použi tento nástroj vždy, keď používateľ chce počúvať rádio alebo
    konkrétnu rozhlasovú stanicu.
  fields:
    hlasitost:
      description: Hlasitosť v percentách (0-100). Nastav len ak to používateľ výslovne
        žiada.
      name: Hlasitosť
      required: false
      selector:
        number:
          max: 100
          min: 0
          step: 5
    miestnost:
      description: Kde sa má rádio pustiť. Ak používateľ miestnosť neurčí, tento parameter
        vynechaj – použije sa obývačka.
      example: spálňa
      name: Miestnosť
      required: false
      selector:
        select:
          options:
          - obývačka
          - spálňa
          - terasa
    stanica:
      description: 'Názov rozhlasovej stanice. Podporované: Expres, Fun rádio, Fun
        Dance, Fun 80-90, Fun Chill, Fun Mileniálky, Vlna, Vlna Oldies Party, Vlna
        Golden Hits, Melody, Europa 2, Rádio Rock, Rádio Slovensko, Rádio FM, Devín,
        Regina, Litera, Junior, Lumen, Jazz, Detské rádio.'
      example: Expres
      name: Stanica
      required: true
      selector:
        text:
  icon: mdi:radio
  mode: restart
  sequence:
  - alias: Katalog stanic
    variables:
      zoznam:
        '80':
        - Fun Rádio 80-90
        - radiobrowser://radio/960f00de-0601-11e8-ae97-52543be04c81
        chill:
        - Fun Rádio Chill
        - radiobrowser://radio/81b88161-c3f7-4958-8165-7d408d7689db
        dance:
        - Fun Rádio Dance
        - radiobrowser://radio/960f000f-0601-11e8-ae97-52543be04c81
        detsk:
        - Detské Rádio
        - radiobrowser://radio/b3db4961-4d2a-460b-89cf-083ad78b3799
        devin:
        - Rádio Devín
        - radiobrowser://radio/96252946-0601-11e8-ae97-52543be04c81
        devín:
        - Rádio Devín
        - radiobrowser://radio/96252946-0601-11e8-ae97-52543be04c81
        europa:
        - Europa 2
        - radiobrowser://radio/cb61763d-d635-4983-82c1-4a6a1e8ad17b
        expres:
        - Rádio Expres
        - radiobrowser://radio/a39a5e69-81c7-4823-aabd-202472fc644b
        fm:
        - Rádio_FM
        - radiobrowser://radio/f98d1243-c62c-4726-ae79-ab728182b098
        fun:
        - Fun Rádio
        - radiobrowser://radio/960efe59-0601-11e8-ae97-52543be04c81
        gold:
        - Rádio Vlna Golden Hits
        - radiobrowser://radio/6d8788ec-3006-40de-b674-35b367940e0d
        jazz:
        - Rádio Jazz
        - radiobrowser://radio/913b7498-8e2d-420b-8c3b-dbacdf9597c4
        junior:
        - Rádio Junior
        - radiobrowser://radio/96122b41-0601-11e8-ae97-52543be04c81
        litera:
        - Rádio Litera
        - radiobrowser://radio/96164051-0601-11e8-ae97-52543be04c81
        lumen:
        - Rádio Lumen
        - radiobrowser://radio/963a8583-0601-11e8-ae97-52543be04c81
        melody:
        - Rádio Melody
        - radiobrowser://radio/f75cc3d3-10eb-40e3-926a-a9030eae3bba
        mileni:
        - Fun Rádio Mileniálky
        - radiobrowser://radio/a79da3d2-8891-4622-ade3-35b8f7a9979c
        oldies:
        - Rádio Vlna Oldies Party
        - radiobrowser://radio/2fb5eb01-7e34-42b7-9b06-2bff5084127b
        party:
        - Rádio Vlna Oldies Party
        - radiobrowser://radio/2fb5eb01-7e34-42b7-9b06-2bff5084127b
        regina:
        - Rádio Regina Západ
        - radiobrowser://radio/962c33ed-0601-11e8-ae97-52543be04c81
        rock:
        - Rádio Rock
        - radiobrowser://radio/cb61d755-6bb7-4575-98d1-cd7434bfa567
        slovensko:
        - Rádio Slovensko
        - radiobrowser://radio/960efc45-0601-11e8-ae97-52543be04c81
        vlna:
        - Rádio Vlna
        - radiobrowser://radio/96121add-0601-11e8-ae97-52543be04c81
      dotaz: '{{ stanica | lower | trim }}'
      miestnost_low: '{{ (miestnost | default('''', true)) | lower }}'
  - alias: Ciel a kluc stanice
    variables:
      cil: '{{ ''media_player.bedroom_2'' if (''spál'' in miestnost_low or ''spal''
        in miestnost_low) else (''media_player.terasa_2'' if ''teras'' in miestnost_low
        else ''media_player.living_room_2'') }}'
      kluc: '{{ zoznam.keys() | select(''in'', dotaz) | list | first | default('''',
        true) }}'
  - alias: Nazov a URI
    variables:
      nazov: '{{ zoznam[kluc][0] if kluc != '''' else stanica }}'
      uri: '{{ zoznam[kluc][1] if kluc != '''' else '''' }}'
  - alias: Neznáma stanica
    if:
    - condition: template
      value_template: '{{ uri == '''' }}'
    then:
    - set_conversation_response: Stanicu {{ stanica }} nepoznám. Skús napríklad Expres,
        Fun rádio, Vlna, Europa 2, Melody alebo Rádio Slovensko.
    - stop: Neznáma stanica
  - alias: Nastaviť hlasitosť ak je zadaná
    if:
    - condition: template
      value_template: '{{ hlasitost is defined and hlasitost | string | trim not in
        ['''', ''None''] }}'
    then:
    - action: media_player.volume_set
      data:
        volume_level: '{{ (hlasitost | float) / 100 }}'
      target:
        entity_id: '{{ cil }}'
  - action: music_assistant.play_media
    alias: Spustiť stanicu cez Music Assistant
    data:
      enqueue: replace
      media_id: '{{ uri }}'
      media_type: radio
    target:
      entity_id: '{{ cil }}'
    continue_on_error: true
  - alias: Pockat kym zacne hrat
    wait_template: '{{ is_state(cil, ''playing'') }}'
    timeout:
      seconds: 10
    continue_on_timeout: true
  - alias: Druhy pokus ak sa nerozbehlo
    if:
    - condition: template
      value_template: '{{ not wait.completed }}'
    then:
    - action: music_assistant.play_media
      continue_on_error: true
      data:
        enqueue: replace
        media_id: '{{ uri }}'
        media_type: radio
      target:
        entity_id: '{{ cil }}'
  - set_conversation_response: Spúšťam {{ nazov }}
pusti_hudbu:
  alias: Pustiť hudbu
  description: Pustí hudbu zo Spotify na Sonos reproduktore cez Music Assistant. Použi
    tento nástroj, keď používateľ chce počúvať konkrétneho interpreta, album, skladbu
    alebo playlist. Na rozhlasové stanice použi namiesto toho nástroj Pustiť rádio.
  fields:
    co:
      description: Čo sa má prehrať – meno interpreta, názov albumu, skladby alebo
        playlistu. Napríklad 'Pink Floyd', 'Dark Side of the Moon', 'Bohemian Rhapsody'.
      example: Pink Floyd
      name: Čo prehrať
      required: true
      selector:
        text:
    hlasitost:
      description: Hlasitosť v percentách (0-100). Nastav len ak to používateľ výslovne
        žiada.
      name: Hlasitosť
      required: false
      selector:
        number:
          max: 100
          min: 0
          step: 5
    miestnost:
      description: Kde sa má hudba pustiť. Ak používateľ miestnosť neurčí, tento parameter
        vynechaj – použije sa obývačka.
      example: spálňa
      name: Miestnosť
      required: false
      selector:
        select:
          options:
          - obývačka
          - spálňa
          - terasa
    podobna_hudba:
      description: Ak je zapnuté, po dohratí pokračuje podobnou hudbou donekonečna.
        Zapni, keď používateľ chce nekonečný rádiový režim alebo 'niečo podobné'.
      name: Pokračovať podobnou hudbou
      required: false
      selector:
        boolean:
    typ:
      description: Typ hľadanej položky. Urči ho, ak je z požiadavky jasný – napr.
        'album Dark Side of the Moon' je album. Ak si nie si istý, parameter vynechaj
        a Music Assistant vyberie sám.
      example: interpret
      name: Typ
      required: false
      selector:
        select:
          options:
          - interpret
          - album
          - skladba
          - playlist
  icon: mdi:spotify
  mode: restart
  sequence:
  - alias: Normálne vstupy
    variables:
      miestnost_low: '{{ (miestnost | default('''', true)) | lower }}'
      typ_low: '{{ (typ | default('''', true)) | lower }}'
  - alias: Ciel a typ media
    variables:
      cil: '{{ ''media_player.bedroom_2'' if (''spál'' in miestnost_low or ''spal''
        in miestnost_low) else (''media_player.terasa_2'' if ''teras'' in miestnost_low
        else ''media_player.living_room_2'') }}'
      typ_ma: '{{ ''artist'' if ''interpret'' in typ_low else (''album'' if ''album''
        in typ_low else (''track'' if ''skladb'' in typ_low else (''playlist'' if
        ''playlist'' in typ_low else ''''))) }}'
  - alias: Nastaviť hlasitosť ak je zadaná
    if:
    - condition: template
      value_template: '{{ hlasitost is defined and hlasitost | string | trim not in
        ['''', ''None''] }}'
    then:
    - action: media_player.volume_set
      data:
        volume_level: '{{ (hlasitost | float) / 100 }}'
      target:
        entity_id: '{{ cil }}'
  - alias: Prehrať – so zadaným typom alebo bez neho
    if:
    - condition: template
      value_template: '{{ typ_ma != '''' }}'
    then:
    - action: music_assistant.play_media
      data:
        enqueue: replace
        media_id: '{{ co }}'
        media_type: '{{ typ_ma }}'
        radio_mode: '{{ podobna_hudba | default(false, true) | bool }}'
      target:
        entity_id: '{{ cil }}'
      continue_on_error: true
    else:
    - action: music_assistant.play_media
      data:
        enqueue: replace
        media_id: '{{ co }}'
        radio_mode: '{{ podobna_hudba | default(false, true) | bool }}'
      target:
        entity_id: '{{ cil }}'
      continue_on_error: true
  - alias: Pockat kym zacne hrat
    wait_template: '{{ is_state(cil, ''playing'') }}'
    timeout:
      seconds: 12
    continue_on_timeout: true
  - alias: Nepodarilo sa prehrat
    if:
    - condition: template
      value_template: '{{ not wait.completed }}'
    then:
    - set_conversation_response: Nepodarilo sa mi spustit {{ co }}. Skus to prosim
        znova.
    - stop: Prehravanie sa nerozbehlo
  - set_conversation_response: Spúšťam {{ co }}
ovladat_tv:
  alias: Ovládať televízor
  description: Zapne alebo vypne televízor TCL v obývačke a spustí na ňom streamovaciu
    aplikáciu. Použi tento nástroj vždy, keď používateľ chce zapnúť alebo vypnúť televízor,
    alebo keď chce pustiť Magio, Netflix, HBO Max, SkyShowtime, Prime Video, JOJ Play,
    YouTube alebo Disney Plus. Ak je televízor vypnutý, najprv ho zapne.
  fields:
    akcia:
      description: Či sa má televízor zapnúť alebo vypnúť. Ak používateľ chce len
        pustiť aplikáciu, použi zapnúť.
      example: zapnúť
      name: Akcia
      required: true
      selector:
        select:
          options:
          - zapnúť
          - vypnúť
    aplikacia:
      description: Ktorú aplikáciu spustiť po zapnutí. Ak používateľ žiadnu neuvedie,
        vynechaj tento parameter – spustí sa Magio. Ak chce len zapnúť televízor bez
        aplikácie, nastav na 'nič'.
      example: Netflix
      name: Aplikácia
      required: false
      selector:
        select:
          options:
          - Magio
          - Netflix
          - HBO Max
          - SkyShowtime
          - Prime Video
          - JOJ Play
          - YouTube
          - Disney Plus
          - nič
  icon: mdi:television
  mode: restart
  sequence:
  - alias: Katalog aplikacii a vstupy
    variables:
      akcia_low: '{{ (akcia | default('''', true)) | lower }}'
      app_vstup: '{{ (aplikacia | default(''magio'', true)) | lower }}'
      apps:
        disney:
        - Disney Plus
        - com.disney.disneyplus/com.bamtechmedia.dominguez.main.MainActivity
        hbo:
        - HBO Max
        - com.wbd.stream/com.wbd.beam.BeamActivity
        joj:
        - JOJ Play
        - io.tiv.tv/.MainActivity
        magio:
        - Magio TV
        - com.telekom.magiogo/com.telekom.tv.player.StbPlayerActivity
        max:
        - HBO Max
        - com.wbd.stream/com.wbd.beam.BeamActivity
        netflix:
        - Netflix
        - com.netflix.ninja/.MainActivity
        prime:
        - Prime Video
        - com.amazon.amazonvideo.livingroom/com.amazon.ignition.IgnitionActivity
        sky:
        - SkyShowtime
        - com.skyshowtime.skyshowtime.google/com.peacock.peacocktv.GoogleMainActivity
        youtube:
        - YouTube
        - com.google.android.youtube.tv/com.google.android.apps.youtube.tv.activity.ShellActivity
      tv_stav: '{{ states(''media_player.living_room_tv_2_2'') }}'
  - alias: Vyhodnotit aplikaciu a stav
    variables:
      app_kluc: '{{ apps.keys() | select(''in'', app_vstup) | list | first | default('''',
        true) }}'
      chce_zapnut: '{{ ''zap'' in akcia_low }}'
      tv_zapnuta: '{{ tv_stav not in [''unavailable'', ''unknown'', ''off'', ''standby'']
        }}'
  - alias: Nazov a komponent aplikacie
    variables:
      app_komponent: '{{ apps[app_kluc][1] if app_kluc != '''' else '''' }}'
      app_nazov: '{{ apps[app_kluc][0] if app_kluc != '''' else '''' }}'
  - alias: Zapnut alebo vypnut
    choose:
    - alias: Zapnut televizor a spustit aplikaciu
      conditions:
      - condition: template
        value_template: '{{ chce_zapnut and not tv_zapnuta }}'
      sequence:
      - alias: Ak je TV na sieti, skusit nativne
        if:
        - condition: template
          value_template: '{{ tv_stav == ''off'' }}'
        note: Nativne turn_on je spolahlivejsie nez IR, lebo nie je toggle.
        then:
        - action: media_player.turn_on
          continue_on_error: true
          target:
            entity_id: media_player.living_room_tv_2_2
        - continue_on_timeout: true
          timeout:
            seconds: 8
          wait_template: '{{ is_state(''media_player.living_room_tv_2_2'', ''on'')
            }}'
      - alias: IR ak TV nie je na sieti alebo nativne nezabralo
        if:
        - condition: template
          value_template: '{{ not is_state(''media_player.living_room_tv_2_2'', ''on'')
            }}'
        note: Stav sa cita nanovo - inak by toggle kod vypol TV, ktora prave nabehla
          nativne.
        then:
        - action: text.set_value
          data:
            value: B7IPsg8YArUH4AUDAcwDgANAF0AL4AcHQBPgAwNAH0ADQBPgCwcHsx+yD7IPGAJAG+ADA0AvQANAE+ALB0AT4AMDQCdAA0AT4AsH4P1n4CZnAgcYAg==
          target:
            entity_id: text.0x6ce4a4fffea1eb1a_ir_code_to_send
        - continue_on_timeout: true
          timeout:
            seconds: 30
          wait_template: '{{ states(''media_player.living_room_tv_2_2'') not in [''unavailable'',
            ''unknown'', ''off''] }}'
      - alias: Spustit aplikaciu cez ADB
        else:
        - set_conversation_response: Zapínam televízor
        if:
        - condition: template
          value_template: '{{ app_komponent != '''' and is_state(''media_player.living_room_tv_2_2'',
            ''on'') }}'
        note: play_media na androidtv_remote otvara len overene odkazy - preto ADB
          s konkretnou aktivitou.
        then:
        - alias: Pockat kym sa ADB pripoji
          continue_on_timeout: true
          timeout:
            seconds: 45
          wait_template: '{{ states(''media_player.living_room_tcl_tv_adb'') not in
            [''unavailable'', ''unknown'', ''off''] }}'
        - alias: Rezerva na dobehnutie systemu
          delay:
            seconds: 3
        - action: androidtv.adb_command
          continue_on_error: true
          data:
            command: am start -n {{ app_komponent }}
          target:
            entity_id: media_player.living_room_tcl_tv_adb
        - set_conversation_response: Zapínam televízor a {{ app_nazov }}
    - alias: Vypnut nativne
      conditions:
      - condition: template
        value_template: '{{ not chce_zapnut and tv_zapnuta }}'
      sequence:
      - action: media_player.turn_off
        continue_on_error: true
        target:
          entity_id: media_player.living_room_tv_2_2
      - set_conversation_response: Vypínam televízor
    - alias: TV uz bezi - len prepnut aplikaciu
      conditions:
      - condition: template
        value_template: '{{ chce_zapnut and tv_zapnuta }}'
      sequence:
      - alias: Prepnut ak je aplikacia zadana
        else:
        - set_conversation_response: Televízor už je zapnutý
        if:
        - condition: template
          value_template: '{{ app_komponent != '''' }}'
        then:
        - action: androidtv.adb_command
          continue_on_error: true
          data:
            command: am start -n {{ app_komponent }}
          target:
            entity_id: media_player.living_room_tcl_tv_adb
        - set_conversation_response: Prepínam na {{ app_nazov }}
    default:
    - set_conversation_response: Televízor už je vypnutý
