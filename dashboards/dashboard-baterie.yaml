# Lovelace dashboard: dashboard-baterie
# Storage mode - export z .storage/lovelace.*

title: Batérie
views:
- title: Batérie
  path: baterie
  icon: mdi:battery-alert-variant
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Stav batérií
      icon: mdi:battery-heart-variant
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-template-card
        primary: |-
          {{ states.sensor
             | selectattr('attributes.device_class','defined')
             | selectattr('attributes.device_class','eq','battery')
             | selectattr('state','is_number')
             | map(attribute='state') | map('int') | select('lt',10) | list | count }}
        secondary: Kriticky (<10 %)
        icon: mdi:battery-alert
        icon_color: red
        layout: vertical
        fill_container: true
      - type: custom:mushroom-template-card
        primary: |-
          {{ states.sensor
             | selectattr('attributes.device_class','defined')
             | selectattr('attributes.device_class','eq','battery')
             | selectattr('state','is_number')
             | map(attribute='state') | map('int') | select('lt',20) | list | count }}
        secondary: Nízke (<20 %)
        icon: mdi:battery-30
        icon_color: orange
        layout: vertical
        fill_container: true
      - type: custom:mushroom-template-card
        primary: |-
          {{ states.sensor
             | selectattr('attributes.device_class','defined')
             | selectattr('attributes.device_class','eq','battery')
             | list | count }}
        secondary: Spolu zariadení
        icon: mdi:battery
        icon_color: green
        layout: vertical
        fill_container: true
  - type: grid
    cards:
    - type: heading
      heading: Vyžadujú pozornosť
      icon: mdi:battery-alert-variant-outline
    - type: custom:auto-entities
      show_empty: false
      card:
        type: entities
        title: 🔴 Kriticky nízke (< 10 %)
        state_color: true
      filter:
        include:
        - attributes:
            device_class: battery
          state: < 10
          options:
            secondary_info: last-changed
      sort:
        method: state
        numeric: true
        reverse: false
    - type: custom:auto-entities
      show_empty: false
      card:
        type: entities
        title: 🟠 Nízke (10–20 %)
        state_color: true
      filter:
        include:
        - attributes:
            device_class: battery
          state: < 20
          options:
            secondary_info: last-changed
        exclude:
        - state: < 10
      sort:
        method: state
        numeric: true
        reverse: false
    - type: custom:auto-entities
      show_empty: false
      card:
        type: entities
        title: ⚠️ Hlásia „slabá batéria"
      filter:
        include:
        - attributes:
            device_class: battery
          domain: binary_sensor
          state: 'on'
  - type: grid
    cards:
    - type: heading
      heading: Všetky zariadenia
      icon: mdi:format-list-bulleted
    - type: custom:auto-entities
      card:
        type: entities
        title: Batérie – od najnižšej
        state_color: true
      filter:
        include:
        - attributes:
            device_class: battery
          domain: sensor
        exclude:
        - state: unavailable
        - state: unknown
      sort:
        method: state
        numeric: true
        reverse: false
