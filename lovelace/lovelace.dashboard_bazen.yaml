config:
  views:
  - icon: mdi:pool
    max_columns: 3
    path: bazen
    sections:
    - cards:
      - custom_fields:
          content: "[[[\n  const state = (entity) => states[entity]?.state ?? '-';\n\
            \  const number = (entity) => Number(states[entity]?.state);\n\n  const\
            \ phEntity = 'sensor.bazen_aseko_asin_aqua_salt_110195262_ph';\n  const\
            \ redoxEntity = 'sensor.bazen_aseko_asin_aqua_salt_110195262_redox_potential';\n\
            \  const tempEntity = 'sensor.bazen_aseko_asin_aqua_salt_110195262_water_temperature';\n\
            \  const saltEntity = 'sensor.bazen_aseko_asin_aqua_salt_110195262_salinity';\n\
            \  const levelEntity = 'sensor.bazen_aseko_asin_aqua_salt_110195262_water_level';\n\
            \  const flowEntity = 'binary_sensor.bazen_aseko_asin_aqua_salt_110195262_water_flow_to_probes';\n\
            \  const connEntity = 'sensor.bazen_aseko_asin_aqua_salt_110195262_connection_status';\n\
            \  const updateEntity = 'sensor.bazen_aseko_asin_aqua_salt_110195262_last_data_update';\n\
            \n  const ph = number(phEntity);\n  const redox = number(redoxEntity);\n\
            \  const flow = states[flowEntity]?.state;\n  const pump = states['binary_sensor.bazen_aseko_asin_aqua_salt_110195262_filtration_pump_running']?.state;\n\
            \  const conn = String(state(connEntity)).toLowerCase();\n\n  function\
            \ parseDateCandidate(value) {\n    if (!value || value === '-' || value\
            \ === 'unknown' || value === 'unavailable') {\n      return null;\n  \
            \  }\n\n    let raw = String(value).trim();\n    let parsed = Date.parse(raw);\n\
            \n    if (isNaN(parsed)) {\n      parsed = Date.parse(raw.replace(' ',\
            \ 'T'));\n    }\n\n    if (isNaN(parsed)) {\n      return null;\n    }\n\
            \n    return new Date(parsed);\n  }\n\n  function ageInfo(entity) {\n\
            \    const obj = states[entity];\n\n    const candidates = [\n      obj?.state,\n\
            \      obj?.attributes?.timestamp,\n      obj?.attributes?.last_update,\n\
            \      obj?.attributes?.last_updated,\n      obj?.last_updated,\n    \
            \  obj?.last_changed\n    ];\n\n    let date = null;\n\n    for (const\
            \ candidate of candidates) {\n      date = parseDateCandidate(candidate);\n\
            \      if (date) break;\n    }\n\n    if (!date) {\n      return {\n \
            \       text: 'nezn\xE1me',\n        seconds: null\n      };\n    }\n\n\
            \    const seconds = Math.max(0, Math.floor((Date.now() - date.getTime())\
            \ / 1000));\n\n    if (seconds < 60) {\n      return {\n        text:\
            \ `${seconds} s`,\n        seconds\n      };\n    }\n\n    const minutes\
            \ = Math.floor(seconds / 60);\n\n    if (minutes < 60) {\n      return\
            \ {\n        text: `${minutes} min`,\n        seconds\n      };\n    }\n\
            \n    const hours = Math.floor(minutes / 60);\n    const restMinutes =\
            \ minutes % 60;\n\n    if (hours < 24) {\n      return {\n        text:\
            \ restMinutes > 0 ? `${hours} h ${restMinutes} min` : `${hours} h`,\n\
            \        seconds\n      };\n    }\n\n    const days = Math.floor(hours\
            \ / 24);\n    const restHours = hours % 24;\n\n    return {\n      text:\
            \ restHours > 0 ? `${days} d ${restHours} h` : `${days} d`,\n      seconds\n\
            \    };\n  }\n\n  const age = ageInfo(updateEntity);\n\n  let status =\
            \ 'Voda vyzer\xE1 v poriadku';\n  let statusClass = 'ok';\n\n  if (conn.includes('off')\
            \ || conn.includes('offline') || conn.includes('unavailable')) {\n   \
            \ status = 'Zariadenie je offline';\n    statusClass = 'bad';\n  } else\
            \ if (age.seconds !== null && age.seconds > 3600) {\n    status = 'D\xE1\
            ta s\xFA star\u0161ie ako 1 h';\n    statusClass = 'bad';\n  } else if\
            \ (pump === 'on' && flow !== 'on') {\n    status = 'Bez prietoku k sond\xE1\
            m';\n    statusClass = 'bad';\n  } else if (!isNaN(ph) && (ph < 6.8 ||\
            \ ph > 7.6)) {\n    status = 'Skontroluj pH vody';\n    statusClass =\
            \ 'warn';\n  } else if (!isNaN(redox) && redox < 650) {\n    status =\
            \ 'N\xEDzky Redox';\n    statusClass = 'warn';\n  } else if (age.seconds\
            \ !== null && age.seconds > 900) {\n    status = 'D\xE1ta s\xFA star\u0161\
            ie ako 15 min';\n    statusClass = 'warn';\n  }\n\n  return `\n    <div\
            \ class=\"pool-hero ${statusClass}\">\n      <div class=\"hero-top\">\n\
            \        <div class=\"hero-icon\">\n          <ha-icon icon=\"mdi:pool\"\
            ></ha-icon>\n        </div>\n\n        <div class=\"hero-main\">\n   \
            \       <div class=\"hero-title\">Baz\xE9n</div>\n          <div class=\"\
            hero-status\">${status}</div>\n        </div>\n      </div>\n\n      <div\
            \ class=\"freshness\">\n        <ha-icon icon=\"mdi:clock-outline\"></ha-icon>\n\
            \        <span>D\xE1ta aktualizovan\xE9 pred</span>\n        <strong>${age.text}</strong>\n\
            \      </div>\n\n      <div class=\"values-title\">Aktu\xE1lne hodnoty</div>\n\
            \n      <div class=\"main-values\">\n        <div class=\"main-metric\"\
            >\n          <div class=\"main-value\">${state(phEntity)}</div>\n    \
            \      <div class=\"main-label\">pH vody</div>\n        </div>\n\n   \
            \     <div class=\"main-metric\">\n          <div class=\"main-value\"\
            >${state(redoxEntity)}</div>\n          <div class=\"main-label\">Redox\
            \ mV</div>\n        </div>\n      </div>\n\n      <div class=\"secondary-values\"\
            >\n        <div class=\"secondary-metric\">\n          <ha-icon icon=\"\
            mdi:thermometer-water\"></ha-icon>\n          <div>\n            <div\
            \ class=\"secondary-value\">${state(tempEntity)} \xB0C</div>\n       \
            \     <div class=\"secondary-label\">Teplota</div>\n          </div>\n\
            \        </div>\n\n        <div class=\"secondary-metric\">\n        \
            \  <ha-icon icon=\"mdi:shaker-outline\"></ha-icon>\n          <div>\n\
            \            <div class=\"secondary-value\">${state(saltEntity)} g/l</div>\n\
            \            <div class=\"secondary-label\">Salinita</div>\n         \
            \ </div>\n        </div>\n\n        <div class=\"secondary-metric\">\n\
            \          <ha-icon icon=\"mdi:waves\"></ha-icon>\n          <div>\n \
            \           <div class=\"secondary-value\">${state(levelEntity)} cm</div>\n\
            \            <div class=\"secondary-label\">Hladina</div>\n          </div>\n\
            \        </div>\n      </div>\n    </div>\n  `;\n]]]\n"
        entity: sensor.bazen_aseko_asin_aqua_salt_110195262_ph
        extra_styles: ".pool-hero {\n  min-height: 380px;\n  padding: 24px;\n  box-sizing:\
          \ border-box;\n  color: white;\n  display: flex;\n  flex-direction: column;\n\
          \  gap: 16px;\n  background: linear-gradient(135deg, #005f86, #0096c7, #00b4d8);\n\
          }\n\n.pool-hero.ok {\n  background: linear-gradient(135deg, #005f73, #0a9396,\
          \ #94d2bd);\n}\n\n.pool-hero.warn {\n  background: linear-gradient(135deg,\
          \ #7a3e00, #c77700, #f59e0b);\n}\n\n.pool-hero.bad {\n  background: linear-gradient(135deg,\
          \ #3b0d0d, #8b1e1e, #dc2626);\n}\n\n.hero-top {\n  display: flex;\n  align-items:\
          \ center;\n  gap: 16px;\n}\n\n.hero-icon {\n  width: 62px;\n  height: 62px;\n\
          \  border-radius: 20px;\n  display: flex;\n  align-items: center;\n  justify-content:\
          \ center;\n  background: rgba(255,255,255,0.18);\n  flex-shrink: 0;\n}\n\
          \n.hero-icon ha-icon {\n  --mdc-icon-size: 40px;\n}\n\n.hero-main {\n  min-width:\
          \ 0;\n}\n\n.hero-title {\n  font-size: 34px;\n  line-height: 1;\n  font-weight:\
          \ 900;\n}\n\n.hero-status {\n  margin-top: 7px;\n  font-size: 16px;\n  font-weight:\
          \ 800;\n  opacity: 0.95;\n}\n\n.freshness {\n  display: flex;\n  align-items:\
          \ center;\n  gap: 8px;\n  width: fit-content;\n  max-width: 100%;\n  padding:\
          \ 9px 13px;\n  border-radius: 999px;\n  background: rgba(255,255,255,0.20);\n\
          \  backdrop-filter: blur(8px);\n  font-size: 13px;\n  font-weight: 700;\n\
          }\n\n.freshness ha-icon {\n  --mdc-icon-size: 18px;\n}\n\n.freshness strong\
          \ {\n  font-size: 15px;\n  font-weight: 900;\n}\n\n.values-title {\n  font-size:\
          \ 13px;\n  font-weight: 900;\n  text-transform: uppercase;\n  letter-spacing:\
          \ 0.08em;\n  opacity: 0.9;\n  margin-top: 2px;\n}\n\n.main-values {\n  display:\
          \ grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 14px;\n\
          }\n\n.main-metric {\n  border-radius: 24px;\n  padding: 20px 16px;\n  background:\
          \ rgba(255,255,255,0.22);\n  backdrop-filter: blur(8px);\n  min-width: 0;\n\
          }\n\n.main-value {\n  font-size: 42px;\n  line-height: 1;\n  font-weight:\
          \ 950;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n\
          }\n\n.main-label {\n  margin-top: 10px;\n  font-size: 13px;\n  font-weight:\
          \ 850;\n  text-transform: uppercase;\n  letter-spacing: 0.06em;\n  opacity:\
          \ 0.92;\n}\n\n.secondary-values {\n  display: grid;\n  grid-template-columns:\
          \ repeat(3, minmax(0, 1fr));\n  gap: 12px;\n}\n\n.secondary-metric {\n \
          \ display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content:\
          \ center;\n  text-align: center;\n  gap: 6px;\n  border-radius: 18px;\n\
          \  padding: 12px 6px;\n  background: rgba(255,255,255,0.17);\n  min-width:\
          \ 0;\n  overflow: hidden;\n}\n\n.secondary-metric > div {\n  min-width:\
          \ 0;\n  width: 100%;\n}\n\n.secondary-metric ha-icon {\n  --mdc-icon-size:\
          \ 24px;\n  flex-shrink: 0;\n}\n\n.secondary-value {\n  font-size: 16px;\n\
          \  line-height: 1.15;\n  font-weight: 900;\n  white-space: normal;\n  word-break:\
          \ break-word;\n}\n\n.secondary-label {\n  margin-top: 2px;\n  font-size:\
          \ 10px;\n  font-weight: 800;\n  text-transform: uppercase;\n  letter-spacing:\
          \ 0.04em;\n  opacity: 0.88;\n  white-space: normal;\n}\n"
        show_icon: false
        show_name: false
        show_state: false
        styles:
          card:
          - border-radius: 30px
          - padding: 0
          - overflow: hidden
          - min-height: 380px
          - box-shadow: 0 12px 32px rgba(0,0,0,0.20)
          custom_fields:
            content:
            - width: 100%
            - height: 100%
          grid:
          - grid-template-areas: '"content"'
          - grid-template-columns: 1fr
          - grid-template-rows: 1fr
        tap_action:
          action: more-info
        type: custom:button-card
      - card:
          columns: 1
          square: false
          type: grid
        card_param: cards
        filter:
          include:
          - entity_id: binary_sensor.bazen_aseko_asin_aqua_salt_110195262_rapid_change_of_ph
            options:
              color: red
              icon: mdi:flask-empty-remove
              name: "Prudk\xE1 zmena pH"
              type: tile
            state: 'on'
          - entity_id: binary_sensor.bazen_aseko_asin_aqua_salt_110195262_too_many_doses_of_ph
            options:
              color: orange
              icon: mdi:flask-round-bottom
              name: "Prive\u013Ea d\xE1vok pH"
              type: tile
            state: 'on'
          - entity_id: binary_sensor.bazen_aseko_asin_aqua_salt_110195262_too_many_doses_of_disinfection
            options:
              color: orange
              icon: mdi:bacteria
              name: "Prive\u013Ea d\xE1vok dezinfekcie"
              type: tile
            state: 'on'
          - entity_id: binary_sensor.bazen_aseko_asin_aqua_salt_110195262_backwash_active
            options:
              color: blue
              icon: mdi:backup-restore
              name: Prebieha preplach filtra
              type: tile
            state: 'on'
          - entity_id: binary_sensor.bazen_aseko_asin_aqua_salt_110195262_water_filling_active
            options:
              color: blue
              icon: mdi:water-plus
              name: "Dop\xFA\u0161\u0165a sa voda"
              type: tile
            state: 'on'
          - entity_id: binary_sensor.bazen_aseko_asin_aqua_salt_110195262_heating_active
            options:
              color: amber
              icon: mdi:fire
              name: "Ohrev be\u017E\xED"
              type: tile
            state: 'on'
        show_empty: false
        type: custom:auto-entities
      - card:
          color: red
          entity: binary_sensor.bazen_aseko_asin_aqua_salt_110195262_no_flow_to_probes
          icon: mdi:water-off
          name: "Bez prietoku k sond\xE1m"
          type: tile
        conditions:
        - condition: state
          entity: binary_sensor.bazen_aseko_asin_aqua_salt_110195262_filtration_pump_running
          state: 'on'
        - condition: state
          entity: binary_sensor.bazen_aseko_asin_aqua_salt_110195262_no_flow_to_probes
          state: 'on'
        type: conditional
      type: grid
    - cards:
      - heading: Wellness
        heading_style: title
        icon: mdi:hot-tub
        type: heading
      - color: purple
        entity: input_boolean.bazen_led_svetlo
        grid_options:
          columns: 6
        hold_action:
          action: more-info
        icon: mdi:led-strip-variant
        name: LED svetlo
        state_content:
        - state
        - last_changed
        tap_action:
          action: perform-action
          perform_action: script.bazen_svetlo_toggle
        type: tile
      - color: cyan
        entity: input_boolean.bazen_wellness_trysky
        grid_options:
          columns: 6
        hold_action:
          action: more-info
        icon: mdi:waves
        name: Trysky
        state_content:
        - state
        - last_changed
        tap_action:
          action: perform-action
          perform_action: script.bazen_trysky_toggle
        type: tile
      - cards:
        - icon: mdi:palette
          icon_color: purple
          multiline_secondary: true
          primary: Zmena farby LED
          secondary: "\u010Eal\u0161\xED sveteln\xFD program"
          tap_action:
            action: perform-action
            perform_action: script.bazen_svetlo_dalsi_program
          type: custom:mushroom-template-card
        - icon: mdi:power-off
          icon_color: grey
          multiline_secondary: true
          primary: "V\u0161etko vypn\xFA\u0165"
          secondary: "Svetl\xE1 aj trysky"
          tap_action:
            action: perform-action
            perform_action: script.bazen_vsetko_off
          type: custom:mushroom-template-card
        columns: 2
        square: false
        type: grid
      - heading: Voda
        heading_style: title
        icon: mdi:water-check
        type: heading
      - cards:
        - entity: sensor.bazen_aseko_asin_aqua_salt_110195262_ph
          max: 8.5
          min: 6
          name: pH
          needle: true
          segments:
          - color: '#d32f2f'
            from: 6
          - color: '#f9a825'
            from: 6.8
          - color: '#2e7d32'
            from: 7
          - color: '#f9a825'
            from: 7.4
          - color: '#d32f2f'
            from: 7.6
          type: gauge
        - entity: sensor.bazen_aseko_asin_aqua_salt_110195262_redox_potential
          max: 900
          min: 300
          name: Redox
          needle: true
          segments:
          - color: '#d32f2f'
            from: 300
          - color: '#f9a825'
            from: 500
          - color: '#2e7d32'
            from: 650
          - color: '#f9a825'
            from: 850
          type: gauge
        - entity: sensor.bazen_aseko_asin_aqua_salt_110195262_salinity
          max: 6
          min: 0
          name: "So\u013E"
          needle: true
          segments:
          - color: '#d32f2f'
            from: 0
          - color: '#f9a825'
            from: 2.5
          - color: '#2e7d32'
            from: 3
          - color: '#f9a825'
            from: 4.5
          - color: '#d32f2f'
            from: 5.5
          type: gauge
        columns: 3
        square: false
        type: grid
      - heading: Teplota
        heading_style: subtitle
        icon: mdi:thermometer
        type: heading
      - color: blue
        entity: sensor.0xa4c1380615dcffff_temperature
        grid_options:
          columns: 6
        icon: mdi:pool
        name: "Dno baz\xE9na"
        state_content:
        - state
        - last_changed
        type: tile
      - color: orange
        entity: sensor.bazen_aseko_asin_aqua_salt_110195262_water_temperature
        grid_options:
          columns: 6
        icon: mdi:pipe
        name: "Pr\xEDvod z filtra"
        state_content:
        - state
        - last_changed
        type: tile
      type: grid
    - cards:
      - heading: "Dop\xFA\u0161\u0165anie vody"
        heading_style: title
        icon: mdi:water-plus
        type: heading
      - custom_fields:
          content: "[[[\n  const lvl  = Number(states['sensor.bazen_aseko_asin_aqua_salt_110195262_water_level']?.state);\n\
            \  const hi   = Number(states['sensor.bazen_aseko_asin_aqua_salt_110195262_water_level_high_alarm']?.state);\n\
            \  const offT = Number(states['sensor.bazen_aseko_asin_aqua_salt_110195262_filling_off_threshold']?.state);\n\
            \  const onT  = Number(states['sensor.bazen_aseko_asin_aqua_salt_110195262_filling_on_threshold']?.state);\n\
            \  const lo   = Number(states['sensor.bazen_aseko_asin_aqua_salt_110195262_water_level_low_alarm']?.state);\n\
            \  const mft  = states['sensor.bazen_aseko_asin_aqua_salt_110195262_max_filling_time']?.state\
            \ ?? '\u2013';\n  const filling = states['binary_sensor.bazen_aseko_asin_aqua_salt_110195262_water_filling_active']?.state\
            \ === 'on';\n\n  const top = hi + 6;\n  const pct = (v) => Math.max(0,\
            \ Math.min(100, (v / top) * 100));\n\n  let status = 'Hladina OK';\n \
            \ let cls = 'ok';\n  if (lvl >= hi)      { status = 'Vysok\xE1 hladina\
            \ \u2013 ALARM'; cls = 'bad'; }\n  else if (lvl <= lo) { status = 'N\xED\
            zka hladina \u2013 ALARM';  cls = 'bad'; }\n  else if (filling)   { status\
            \ = 'Dop\xFA\u0161\u0165a sa voda';         cls = 'fill'; }\n  else if\
            \ (lvl < onT) { status = 'Dop\xFA\u0161\u0165a sa voda';         cls =\
            \ 'fill'; }\n\n  const marks = [\n    { v: hi,   label: 'Vysok\xE1 hladina\
            \ \u2013 alarm', cls: 'm-bad' },\n    { v: offT, label: 'Dop\xFA\u0161\
            \u0165anie sa vypne',         cls: 'm-ok' },\n    { v: onT,  label: 'Dop\xFA\
            \u0161\u0165anie sa zapne',         cls: 'm-fill' },\n    { v: lo,   label:\
            \ 'N\xEDzka hladina \u2013 alarm',  cls: 'm-bad' }\n  ];\n\n  const markHtml\
            \ = marks.map(m => `\n    <div class=\"mark ${m.cls}\" style=\"bottom:${pct(m.v)}%\"\
            >\n      <span class=\"mv\">${m.v} cm</span>\n      <span class=\"ml\"\
            >${m.label}</span>\n    </div>`).join('');\n\n  return `\n    <div class=\"\
            wl\">\n      <div class=\"wl-title\">Hladina vody</div>\n      <div class=\"\
            wl-status ${cls}\">${status}</div>\n      <div class=\"wl-body\">\n  \
            \      <div class=\"tube\">\n          <div class=\"fillbar ${cls}\" style=\"\
            height:${pct(lvl)}%\"></div>\n          <div class=\"cur\" style=\"bottom:${pct(lvl)}%\"\
            ></div>\n          ${markHtml}\n        </div>\n        <div class=\"\
            big\">\n          <span class=\"bigval\">${Number.isFinite(lvl) ? lvl\
            \ : '\u2013'}</span><span class=\"bigunit\">cm</span>\n        </div>\n\
            \      </div>\n      <div class=\"wl-foot\">\n        <span class=\"fl\"\
            >Max. \u010Das dop\xFA\u0161\u0165ania</span>\n        <span class=\"\
            fv\">${mft} min</span>\n      </div>\n    </div>\n  `;\n]]]\n"
        entity: sensor.bazen_aseko_asin_aqua_salt_110195262_water_level
        extra_styles: ".wl { padding: 18px 16px 16px; box-sizing: border-box; }\n\
          .wl-title { font-size: 19px; font-weight: 800; }\n.wl-status { font-size:\
          \ 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;\
          \ margin-top: 3px; }\n.wl-status.ok { color: #16a34a; }\n.wl-status.fill\
          \ { color: #0284c7; }\n.wl-status.bad { color: #dc2626; }\n.wl-body { display:\
          \ flex; align-items: stretch; gap: 14px; margin-top: 16px; }\n.tube { position:\
          \ relative; width: 26px; min-height: 200px; border-radius: 13px; background:\
          \ rgba(148,163,184,0.20); flex: 0 0 26px; }\n.fillbar { position: absolute;\
          \ left: 0; right: 0; bottom: 0; border-radius: 13px; transition: height\
          \ 0.4s ease; }\n.fillbar.ok { background: linear-gradient(180deg, #38bdf8,\
          \ #0284c7); }\n.fillbar.fill { background: linear-gradient(180deg, #60a5fa,\
          \ #1d4ed8); }\n.fillbar.bad { background: linear-gradient(180deg, #f87171,\
          \ #dc2626); }\n.cur { position: absolute; left: -5px; right: -5px; height:\
          \ 3px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.3);\
          \ }\n.mark { position: absolute; left: 38px; transform: translateY(50%);\
          \ white-space: nowrap; line-height: 1.1; }\n.mark::before { content: '';\
          \ position: absolute; left: -38px; width: 34px; top: 50%; border-top: 1px\
          \ dashed rgba(128,128,128,0.55); }\n.mv { font-size: 13px; font-weight:\
          \ 800; margin-right: 7px; }\n.ml { font-size: 11px; opacity: 0.72; }\n.m-bad\
          \ .mv { color: #dc2626; }\n.m-ok .mv { color: #16a34a; }\n.m-fill .mv {\
          \ color: #0284c7; }\n.big { margin-left: auto; display: flex; align-items:\
