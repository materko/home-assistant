          content: "[[[\n  const ents = Object.keys(states).filter(e =>\n    (e.startsWith('light.')\
            \ || e.startsWith('switch.')) &&\n    !e.includes('_segment_')\n  );\n\
            \n  const lights = [\n    'light.light_obyvacka_ziarovky','light.rgbic_tv_light_bars_2','light.tv_backlight_3_lite_2',\n\
            \    'light.christmas_tree_lights_2','light.glide_hexa_2','light.govee_glide_wall_light_2',\n\
            \    'switch.0x54ef44100139126d_left','switch.0x54ef44100139126d_right',\n\
            \    'switch.0x54ef441001390cb3_left','switch.0x54ef441001390cb3_right',\n\
            \    'switch.0x54ef44100155edd6','switch.0x54ef44100159ae8a','switch.0x54ef44100133a004',\n\
            \    'switch.0x54ef441001352b4c','switch.ir_switch_light_big','switch.ir_switch_light_small',\n\
            \    'switch.0x54ef4410014b82bc_top','switch.0x54ef44100133a314','switch.0x54ef441001352af8',\n\
            \    'switch.0x54ef4410013a1882','switch.0xa4c138e03a6d8cae_l1','switch.0xa4c138e03a6d8cae_l2',\n\
            \    'switch.0xa4c138b441ac38d9','switch.0x54ef441000d3835f'\n  ];\n\n\
            \  const on = lights.filter(e => states[e]?.state === 'on');\n  const\
            \ total = lights.length;\n  const cls = on.length === 0 ? 'zero' : (on.length\
            \ > 6 ? 'many' : 'some');\n  const word = on.length === 1 ? 'svetlo svieti'\
            \ : (on.length < 5 ? 'svetl\xE1 svietia' : 'svetiel svieti');\n\n  return\
            \ `\n    <div class=\"lh ${cls}\">\n      <div class=\"lh-icon\"><ha-icon\
            \ icon=\"mdi:lightbulb-group\"></ha-icon></div>\n      <div class=\"lh-main\"\
            >\n        <div class=\"lh-big\">${on.length}<span class=\"lh-tot\">/${total}</span></div>\n\
            \        <div class=\"lh-sub\">${word}</div>\n      </div>\n    </div>\n\
            \  `;\n]]]\n"
        extra_styles: ".lh {\n  display: flex;\n  align-items: center;\n  gap: 16px;\n\
          \  padding: 22px 20px;\n  border-radius: 26px;\n  color: #fff;\n}\n.lh.zero\
          \ { background: linear-gradient(135deg, #334155, #64748b); }\n.lh.some {\
          \ background: linear-gradient(135deg, #0284c7, #38bdf8); }\n.lh.many { background:\
          \ linear-gradient(135deg, #b45309, #f59e0b); }\n.lh-icon {\n  width: 54px;\
          \ height: 54px;\n  display: flex; align-items: center; justify-content:\
          \ center;\n  border-radius: 18px;\n  background: rgba(255,255,255,0.22);\n\
          \  --mdc-icon-size: 30px;\n}\n.lh-big { font-size: 38px; font-weight: 900;\
          \ line-height: 1; }\n.lh-tot { font-size: 19px; font-weight: 700; opacity:\
          \ 0.75; }\n.lh-sub { font-size: 13px; font-weight: 700; text-transform:\
          \ uppercase; letter-spacing: 0.07em; opacity: 0.92; margin-top: 4px; }\n"
        show_icon: false
        show_name: false
        show_state: false
        styles:
