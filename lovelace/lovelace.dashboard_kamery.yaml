config:
  views:
  - badges:
    - entity: binary_sensor.vchod_motion
      name: Vchod
      show_state: true
      state_content:
      - state
      - last_changed
      tap_action:
        action: navigate
        navigation_path: /dashboard-kamery/udalosti
      type: entity
    - entity: binary_sensor.entry_motion
      name: Entry
      show_state: true
      state_content:
      - state
      - last_changed
      tap_action:
        action: navigate
        navigation_path: /dashboard-kamery/udalosti
      type: entity
    - entity: binary_sensor.terrace_motion
      name: Terasa
      show_state: true
      state_content:
      - state
      - last_changed
      tap_action:
        action: navigate
        navigation_path: /dashboard-kamery/udalosti
      type: entity
    icon: mdi:cctv
    max_columns: 2
    path: kamery
    sections:
    - cards:
      - badges:
        - icon: mdi:arrow-expand-all
          tap_action:
            action: navigate
            navigation_path: /dashboard-kamery/udalosti
          type: button
        heading: "Alarmy \u2014 klikni na n\xE1h\u013Ead a prehr\xE1 sa video"
        heading_style: title
        icon: mdi:alarm-light
        type: heading
      - aspect_ratio: '16:9'
        auto_muted: true
        autoplay: false
        card_height: 520
        grid_options:
          columns: full
        live_camera_entities:
        - camera.vchod_fluent
        - camera.entry_fluent
        - camera.terrace_fluent
        live_enabled: true
        max_media: 200
        media_sources:
        - media-source://media_source/local/kamery/vchod
        - media-source://media_source/local/kamery/entry
        - media-source://media_source/local/kamery/terrace
        object_fit: contain
        path_datetime_format: YYYY-MM-DD_HH-mm-ss
        preview_position: top
        source_mode: media
        start_mode: gallery
        thumb_layout: horizontal
        thumb_size: 90
        thumb_sort_order: newest
        type: custom:camera-gallery-card
      - content: "**Alarmy** = klipy z momentu pohybu, ktor\xE9 sa s\u0165ahuj\xFA\
          \ z NVR do `/media/kamery/` (dr\u017Eia sa 14 dn\xED). Klik na n\xE1h\u013E\
          ad hore ho prehr\xE1. Celkov\xFA d\u013A\u017Eku klipu aj to, ko\u013Eko\
          \ z nej je pred triggerom, nastav\xED\u0161 dole v *Nastaveniach*.\n\n**Arch\xED\
          v NVR** = s\xFAvisl\xFD 24/7 z\xE1znam z disku NVR. Otvor\xED\u0161 ho tla\u010D\
          idlom *Arch\xEDv NVR* pri kamere \u2014 prehr\xE1vanie za\u010Dne priamo\
          \ v danom \xFAseku, nie od za\u010Diatku hodiny."
        text_only: true
        type: markdown
      column_span: 2
      type: grid
    - cards:
      - heading: Vchod
        icon: mdi:door
        type: heading
      - camera_view: auto
        entity: camera.vchod_fluent
        grid_options:
          columns: full
        name: Vchod
        show_name: true
        show_state: false
        type: picture-entity
      - entity: binary_sensor.vchod_motion
        grid_options:
          columns: 6
        icon: mdi:motion-sensor
        name: "Pohyb \u2014 alarmy"
        state_content:
        - state
        - last_changed
        tap_action:
          action: navigate
          navigation_path: /dashboard-kamery/udalosti
        type: tile
      - grid_options:
          columns: 6
          rows: 1
        icon: mdi:server
        name: "Arch\xEDv NVR"
        tap_action:
          action: navigate
          navigation_path: /media-browser/browser/playlist%2Cmedia-source%3A%2F%2Freolink%2FRES%7C01KZ71YKH1WFBYGW1VWTNQ4YR3%7C2%7Csub
        type: button
      type: grid
    - cards:
      - heading: Entry
        icon: mdi:home-import-outline
        type: heading
      - camera_view: auto
        entity: camera.entry_fluent
        grid_options:
          columns: full
        name: Entry
        show_name: true
        show_state: false
        type: picture-entity
      - entity: binary_sensor.entry_motion
        grid_options:
          columns: 6
        icon: mdi:motion-sensor
        name: "Pohyb \u2014 alarmy"
        state_content:
        - state
        - last_changed
        tap_action:
          action: navigate
          navigation_path: /dashboard-kamery/udalosti
        type: tile
      - grid_options:
          columns: 6
          rows: 1
        icon: mdi:server
        name: "Arch\xEDv NVR"
        tap_action:
          action: navigate
          navigation_path: /media-browser/browser/playlist%2Cmedia-source%3A%2F%2Freolink%2FRES%7C01KZ71YKH1WFBYGW1VWTNQ4YR3%7C0%7Csub
        type: button
      type: grid
    - cards:
      - heading: Terasa
        icon: mdi:home-floor-g
        type: heading
      - camera_view: auto
        entity: camera.terrace_fluent
        grid_options:
          columns: full
        name: Terasa
        show_name: true
        show_state: false
        type: picture-entity
      - entity: binary_sensor.terrace_motion
        grid_options:
          columns: 6
        icon: mdi:motion-sensor
        name: "Pohyb \u2014 alarmy"
        state_content:
        - state
        - last_changed
        tap_action:
          action: navigate
          navigation_path: /dashboard-kamery/udalosti
        type: tile
      - grid_options:
          columns: 6
          rows: 1
        icon: mdi:server
        name: "Arch\xEDv NVR"
        tap_action:
          action: navigate
          navigation_path: /media-browser/browser/playlist%2Cmedia-source%3A%2F%2Freolink%2FRES%7C01KZ71YKH1WFBYGW1VWTNQ4YR3%7C1%7Csub
        type: button
      type: grid
    - cards:
      - heading: "Hist\xF3ria pohybu (24 h)"
        icon: mdi:chart-timeline
        type: heading
      - entities:
        - entity: binary_sensor.vchod_motion
          name: Vchod
        - entity: binary_sensor.entry_motion
          name: Entry
        - entity: binary_sensor.terrace_motion
          name: Terasa
        grid_options:
          columns: full
          rows: 4
        hours_to_show: 24
        type: history-graph
      - heading: Nastavenia
        heading_style: subtitle
        icon: mdi:tune
        type: heading
      - entity: automation.kamery_nahrat_klip_pri_pohybe
        grid_options:
          columns: 8
          rows: 1
        icon: mdi:record-rec
        name: "Nahr\xE1vanie klipov"
        type: tile
      - entity: automation.kamery_zmazat_stare_klipy
        grid_options:
          columns: 8
          rows: 1
        icon: mdi:broom
        name: "Mazanie po 14 d\u0148och"
        type: tile
      - entity: input_number.kamery_predzaznam_alarmu
        features:
        - style: buttons
          type: numeric-input
        features_position: inline
        grid_options:
          columns: 8
          rows: 1
        icon: mdi:rewind
        name: "Pred-z\xE1znam"
        type: tile
      - entity: input_number.kamery_dlzka_klipu_alarmu
        features:
        - style: buttons
          type: numeric-input
        features_position: inline
        grid_options:
          columns: 8
          rows: 1
        icon: mdi:timer-outline
        name: "D\u013A\u017Eka klipu"
        type: tile
      column_span: 2
      type: grid
    title: Kamery
    type: sections
  - cards:
    - aspect_ratio: '16:9'
      auto_muted: true
      autoplay: false
      card_height: 200
      card_mod:
        style: ":host {\n  display: block;\n  max-width: 1100px;\n  margin: 0 auto;\n\
          }\nha-card {\n  max-width: 1100px;\n  margin: 0 auto;\n}\n"
      live_camera_entities:
      - camera.vchod_fluent
      - camera.entry_fluent
      - camera.terrace_fluent
      live_enabled: true
      max_media: 400
      media_sources:
      - media-source://media_source/local/kamery/vchod
      - media-source://media_source/local/kamery/entry
      - media-source://media_source/local/kamery/terrace
      object_fit: contain
      path_datetime_format: YYYY-MM-DD_HH-mm-ss
      preview_position: top
      source_mode: media
      start_mode: gallery
      thumb_layout: horizontal
      thumb_size: 110
      thumb_sort_order: newest
      type: custom:camera-gallery-card
    icon: mdi:timeline-clock
    path: udalosti
    title: Udalosti
    type: panel
