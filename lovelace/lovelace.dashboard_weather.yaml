config:
  title: "Meteo \u2013 Zohor"
  views:
  - dense_section_placement: true
    icon: mdi:weather-partly-cloudy
    max_columns: 3
    path: meteo
    sections:
    - cards:
      - badges:
        - entity: sensor.izohor9_temperature
          icon: mdi:thermometer
          type: entity
        - entity: sensor.izohor9_relative_humidity
          icon: mdi:water-percent
          type: entity
        - entity: sensor.izohor9_wind_speed
          icon: mdi:weather-windy
          type: entity
        heading: "Zohor \xB7 Meteo stanica"
        icon: mdi:weather-partly-cloudy
        type: heading
      - daily_forecast: true
        daily_min_gap: 20
        entity: weather.zahrada_meteo_stanica_zohor
        grid_options:
          columns: full
          rows: auto
        header_temperature_entity: sensor.izohor9_temperature
        hourly_forecast: true
        hourly_min_gap: 14
        orientation: vertical
        show_header: true
        show_sun_times: true
        sun_use_home_coordinates: true
        type: custom:weather-forecast-extended-card
        use_night_header_backgrounds: true
      - alignment: center
        chips:
        - content: '{{ states(''sensor.izohor9_neighborhood'') }}'
          entity: sensor.izohor9_neighborhood
          icon: mdi:map-marker
          icon_color: red
          tap_action:
            action: more-info
          type: template
        - content: 'Pred {{ relative_time(states.sensor.izohor9_temperature.last_updated)
            }}

            '
          entity: sensor.izohor9_temperature
          icon: mdi:update
          icon_color: "{% set age = as_timestamp(now()) -\n  as_timestamp(states.sensor.izohor9_temperature.last_updated)\
            \ %}\n{% if age > 1200 %} red {% elif age > 600 %} orange {% else %} green\
            \ {% endif %}\n"
          tap_action:
            action: more-info
          type: template
        - content: '{{ states(''sensor.izohor9_elevation'') }} m'
          entity: sensor.izohor9_elevation
          icon: mdi:elevation-rise
          icon_color: blue
          tap_action:
            action: more-info
          type: template
        - content: '{{ states(''sensor.izohor9_station_id'') }}'
          entity: sensor.izohor9_station_id
          icon: mdi:access-point
          icon_color: grey
          tap_action:
            action: more-info
          type: template
        grid_options:
          columns: full
          rows: 1
        type: custom:mushroom-chips-card
      column_span: 2
      type: grid
    - cards:
      - badges:
        - entity: sensor.izohor9_pressure
          icon: mdi:gauge
          type: entity
        - entity: sensor.izohor9_uv_index
          icon: mdi:sun-wireless
          type: entity
        heading: "Aktu\xE1lny stav"
        icon: mdi:view-dashboard-variant
        type: heading
      - entity: sensor.izohor9_temperature
        grid_options:
          columns: full
          rows: auto
        icon: "{% set age = as_timestamp(now()) -\n  as_timestamp(states.sensor.izohor9_temperature.last_updated)\
          \ %}\n{% set rain = states('sensor.izohor9_precipitation_rate') | float(0)\
          \ %} {% set gust = states('sensor.izohor9_wind_gust') | float(0) %} {% set\
          \ uv = states('sensor.izohor9_uv_index') | float(0) %} {% set temp = states('sensor.izohor9_temperature')\
          \ | float(0) %} {% if age > 1200 %} mdi:access-point-off {% elif gust >=\
          \ 60 %} mdi:weather-hurricane {% elif rain >= 5 %} mdi:weather-pouring {%\
          \ elif temp >= 35 %} mdi:thermometer-alert {% elif temp <= -10 %} mdi:snowflake-alert\
          \ {% elif uv >= 8 %} mdi:sun-wireless-outline {% elif rain > 0 %} mdi:weather-rainy\
          \ {% elif gust >= 35 %} mdi:weather-windy-variant {% else %} mdi:check-decagram\
          \ {% endif %}\n"
        icon_color: "{% set age = as_timestamp(now()) -\n  as_timestamp(states.sensor.izohor9_temperature.last_updated)\
          \ %}\n{% set rain = states('sensor.izohor9_precipitation_rate') | float(0)\
          \ %} {% set gust = states('sensor.izohor9_wind_gust') | float(0) %} {% set\
          \ uv = states('sensor.izohor9_uv_index') | float(0) %} {% set temp = states('sensor.izohor9_temperature')\
          \ | float(0) %} {% if age > 1200 or gust >= 60 or temp >= 35 or temp <=\
          \ -10 %} red {% elif rain >= 5 or uv >= 8 or gust >= 35 %} orange {% elif\
          \ rain > 0 %} blue {% else %} green {% endif %}\n"
        multiline_secondary: true
        primary: "{% set age = as_timestamp(now()) -\n  as_timestamp(states.sensor.izohor9_temperature.last_updated)\
          \ %}\n{% set rain = states('sensor.izohor9_precipitation_rate') | float(0)\
          \ %} {% set gust = states('sensor.izohor9_wind_gust') | float(0) %} {% set\
          \ uv = states('sensor.izohor9_uv_index') | float(0) %} {% set temp = states('sensor.izohor9_temperature')\
          \ | float(0) %} {% if age > 1200 %}\n  Stanica neposiela \u010Derstv\xE9\
          \ d\xE1ta\n{% elif gust >= 60 %}\n  Nebezpe\u010Dne siln\xE9 n\xE1razy\n\
          {% elif rain >= 5 %}\n  Siln\xFD d\xE1\u017E\u010F\n{% elif temp >= 35 %}\n\
          \  Extr\xE9mne teplo\n{% elif temp <= -10 %}\n  Siln\xFD mr\xE1z\n{% elif\
          \ uv >= 8 %}\n  Ve\u013Emi vysok\xE9 UV \u017Eiarenie\n{% elif rain > 0\
          \ %}\n  Aktu\xE1lne pr\u0161\xED\n{% elif gust >= 35 %}\n  Silnej\u0161\xED\
          \ vietor\n{% else %}\n  Bez v\xFDrazn\xE9ho rizika\n{% endif %}\n"
        secondary: "{% set age = as_timestamp(now()) -\n  as_timestamp(states.sensor.izohor9_temperature.last_updated)\
          \ %}\n{% set rain = states('sensor.izohor9_precipitation_rate') | float(0)\
          \ %} {% set gust = states('sensor.izohor9_wind_gust') | float(0) %} {% set\
          \ uv = states('sensor.izohor9_uv_index') | float(0) %} {% set temp = states('sensor.izohor9_temperature')\
          \ | float(0) %} {% if age > 1200 %}\n  Posledn\xE1 zmena pred {{ relative_time(states.sensor.izohor9_temperature.last_updated)\
          \ }}.\n{% elif gust >= 60 %}\n  N\xE1razy {{ gust | round(0) }} km/h. Zaisti\
          \ vo\u013En\xE9 predmety.\n{% elif rain >= 5 %}\n  {{ rain | round(1) }}\
          \ mm/h \xB7 dnes {{ states('sensor.izohor9_precipitation_today') }} mm.\n\
          {% elif temp >= 35 %}\n  {{ temp | round(1) }} \xB0C. Obmedz z\xE1\u0165\
          a\u017E na slnku.\n{% elif temp <= -10 %}\n  {{ temp | round(1) }} \xB0\
          C. Riziko zam\u0155zania.\n{% elif uv >= 8 %}\n  UV {{ uv | round(0) }}.\
          \ Ochrana ko\u017Ee a o\u010D\xED je nutn\xE1.\n{% elif rain > 0 %}\n  {{\
          \ rain | round(1) }} mm/h \xB7 dnes {{ states('sensor.izohor9_precipitation_today')\
          \ }} mm.\n{% elif gust >= 35 %}\n  N\xE1razy {{ gust | round(0) }} km/h.\n\
          {% else %}\n  {{ states('sensor.izohor9_temperature') }} \xB0C \xB7\n  {{\
          \ states('sensor.izohor9_relative_humidity') }} % \xB7\n  {{ states('sensor.izohor9_wind_speed')\
          \ }} km/h\n{% endif %}\n"
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      - entity: sensor.izohor9_temperature
        fill_container: true
        grid_options:
          columns: 6
          rows: 2
        icon: mdi:thermometer
        icon_color: '{% set t = states(''sensor.izohor9_temperature'') | float(0)
          %} {% if t <= 0 %} blue {% elif t >= 30 %} red {% elif t >= 24 %} orange
          {% else %} green {% endif %}

          '
        layout: vertical
        primary: "{{ states('sensor.izohor9_temperature') }} \xB0C"
        secondary: Teplota
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      - entity: sensor.izohor9_relative_humidity
        fill_container: true
        grid_options:
          columns: 6
          rows: 2
        icon: mdi:water-percent
        icon_color: '{% set h = states(''sensor.izohor9_relative_humidity'') | float(0)
          %} {% if h >= 85 %} blue {% elif h <= 30 %} orange {% else %} cyan {% endif
          %}

          '
        layout: vertical
        primary: '{{ states(''sensor.izohor9_relative_humidity'') }} %'
        secondary: "Vlhkos\u0165"
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      - entity: sensor.izohor9_heat_index
        fill_container: true
        grid_options:
          columns: 6
          rows: 2
        icon: '{% set t = states(''sensor.izohor9_temperature'') | float(0) %} {%
          if t >= 20 %} mdi:sun-thermometer {% else %} mdi:snowflake-thermometer {%
          endif %}

          '
        icon_color: '{% set t = states(''sensor.izohor9_temperature'') | float(0)
          %} {% if t >= 30 %} red {% elif t >= 24 %} orange {% elif t <= 0 %} blue
          {% else %} teal {% endif %}

          '
        layout: vertical
        primary: "{% set t = states('sensor.izohor9_temperature') | float(0) %} {%\
          \ if t >= 20 %}\n  {{ states('sensor.izohor9_heat_index') }} \xB0C\n{% else\
          \ %}\n  {{ states('sensor.izohor9_wind_chill') }} \xB0C\n{% endif %}\n"
        secondary: "Pocitov\xE1"
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      - entity: sensor.izohor9_dewpoint
        fill_container: true
        grid_options:
          columns: 6
          rows: 2
        icon: mdi:water-thermometer
        icon_color: '{% set d = states(''sensor.izohor9_dewpoint'') | float(0) %}
          {% if d >= 20 %} blue {% elif d >= 16 %} orange {% else %} teal {% endif
          %}

          '
        layout: vertical
        primary: "{{ states('sensor.izohor9_dewpoint') }} \xB0C"
        secondary: "Rosn\xFD bod"
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      - entity: sensor.izohor9_pressure
        fill_container: true
        grid_options:
          columns: 6
          rows: 2
        icon: mdi:gauge
        icon_color: '{% set p = states(''sensor.izohor9_pressure'') | float(0) %}
          {% if p < 995 %} orange {% elif p > 1030 %} blue {% else %} green {% endif
          %}

          '
        layout: vertical
        primary: '{{ states(''sensor.izohor9_pressure'') }} hPa'
        secondary: Tlak
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      - entity: sensor.izohor9_uv_index
        fill_container: true
        grid_options:
          columns: 6
          rows: 2
        icon: mdi:sun-wireless
        icon_color: '{% set uv = states(''sensor.izohor9_uv_index'') | float(0) %}
          {% if uv >= 8 %} red {% elif uv >= 6 %} orange {% elif uv >= 3 %} yellow
          {% else %} green {% endif %}

          '
        layout: vertical
        primary: '{{ states(''sensor.izohor9_uv_index'') }}'
        secondary: UV index
        tap_action:
          action: more-info
        type: custom:mushroom-template-card
      column_span: 1
      type: grid
    - cards:
      - badges:
        - entity: sensor.izohor9_precipitation_today
          icon: mdi:cup-water
          type: entity
        - entity: sensor.izohor9_wind_gust
          icon: mdi:weather-tornado
          type: entity
        - entity: sensor.izohor9_solar_radiation
          icon: mdi:solar-power
          type: entity
        heading: "Trendy za posledn\xFDch 24\u201348 hod\xEDn"
        icon: mdi:chart-line
        type: heading
      - apex_config:
          chart:
            height: 235
            toolbar:
              show: false
          grid:
            borderColor: var(--divider-color)
          legend:
            show: true
          stroke:
            curve: smooth
          xaxis:
            labels:
              datetimeUTC: false
        graph_span: 48h
        grid_options:
          columns: 4
          rows: 5
        header:
          colorize_states: true
          show: true
          show_states: true
          title: "Teplota a vlhkos\u0165"
        now:
          label: Teraz
          show: true
        section_mode: true
        series:
        - color: '#ff8a00'
          entity: sensor.izohor9_temperature
          extend_to: now
          group_by:
            duration: 15min
            func: avg
          name: Teplota
          opacity: 0.18
          show:
            extremas: true
          stroke_width: 3
          type: area
          yaxis_id: temperature
        - color: '#00a6c8'
          entity: sensor.izohor9_dewpoint
          extend_to: now
          group_by:
            duration: 15min
            func: avg
          name: "Rosn\xFD bod"
          stroke_width: 2
          type: line
          yaxis_id: temperature
        - color: '#4c8dff'
          entity: sensor.izohor9_relative_humidity
          extend_to: now
          group_by:
            duration: 15min
            func: avg
          name: "Vlhkos\u0165"
          stroke_width: 2
          type: line
          yaxis_id: humidity
        type: custom:apexcharts-card
        update_interval: 5min
        yaxis:
        - decimals: 1
          id: temperature
        - decimals: 0
          id: humidity
          max: 100
          min: 0
          opposite: true
      - apex_config:
          chart:
            height: 235
            toolbar:
              show: false
          grid:
            borderColor: var(--divider-color)
          legend:
            show: true
          stroke:
            curve: smooth
          xaxis:
            labels:
              datetimeUTC: false
        graph_span: 24h
        grid_options:
          columns: 4
          rows: 5
        header:
          colorize_states: true
          show: true
          show_states: true
          title: "Vietor a n\xE1razy"
        now:
          label: Teraz
          show: true
        section_mode: true
        series:
        - color: '#00a6c8'
          entity: sensor.izohor9_wind_speed
          extend_to: now
          group_by:
            duration: 10min
            func: avg
          name: Vietor
          opacity: 0.16
          stroke_width: 3
          type: area
        - color: '#ff6b35'
          entity: sensor.izohor9_wind_gust
          extend_to: now
          group_by:
            duration: 10min
            func: max
          name: "N\xE1razy"
          show:
            extremas: true
          stroke_width: 3
          type: line
        type: custom:apexcharts-card
        update_interval: 5min
        yaxis:
        - decimals: 0
          min: 0
      - apex_config:
          chart:
            height: 235
            toolbar:
              show: false
          grid:
            borderColor: var(--divider-color)
          plotOptions:
            bar:
              borderRadius: 3
              columnWidth: 75%
          xaxis:
            labels:
              datetimeUTC: false
        graph_span: 24h
        grid_options:
          columns: 4
          rows: 5
        header:
          colorize_states: true
          show: true
          show_states: true
          title: "Intenzita da\u017E\u010Fa"
        now:
          label: Teraz
          show: true
        section_mode: true
        series:
        - color: '#2797ff'
          entity: sensor.izohor9_precipitation_rate
          group_by:
            duration: 10min
            func: max
          name: "D\xE1\u017E\u010F"
          type: column
        type: custom:apexcharts-card
        update_interval: 5min
        yaxis:
        - decimals: 1
          min: 0
      column_span: 3
      type: grid
    - cards:
      - badges:
        - entity: sensor.izohor9_wind_direction_cardinal
          icon: mdi:compass
          type: entity
        - entity: sensor.izohor9_uv_index
          icon: mdi:sun-wireless
          type: entity
        - entity: sensor.izohor9_pressure
          icon: mdi:gauge
          type: entity
        heading: "Vietor, slnko a atmosf\xE9ra"
        icon: mdi:weather-windy-variant
        type: heading
      - buttons_config:
          buttons:
          - active: true
            button_text: 24 h
            period_back: -24h
            type: period_selector
          - button_text: "7 dn\xED"
            preset_period: last_7_days
            type: period_selector
          location: bottom
        card_width: 8
        corner_info:
          bottom_left:
            entity: sensor.izohor9_wind_direction_cardinal
            label: Smer
          bottom_right:
            entity: sensor.izohor9_precipitation_rate
            label: "Zr\xE1\u017Eky"
            precision: 1
            unit: ' mm/h'
          top_left:
            entity: sensor.izohor9_wind_speed
            label: Vietor
            precision: 1
            unit: ' km/h'
          top_right:
            entity: sensor.izohor9_wind_gust
            label: "N\xE1razy"
            precision: 1
            unit: ' km/h'
        current_direction:
          arrow_size: 45
          hide_direction_below_speed: 1
          show_arrow: true
        direction_labels:
          cardinal_direction_letters: NESW
          custom_labels:
            e: V
            n: S
            ne: SV
            nw: SZ
            s: J
            se: JV
            sw: JZ
            w: Z
          show_cardinal_directions: true
          show_intercardinal_directions: true
          show_secondary_intercardinal_directions: false
        grid_options:
          columns: 6
          rows: 8
        refresh_interval: 300
        rose_config:
          rose_opacity: 0.88
          wind_direction_count: 16
        title: Smer a sila vetra
        type: custom:windrose-card
        wind_direction_entity:
          entity: sensor.izohor9_wind_direction_degrees
        windspeed_bar_location: right
        windspeed_entities:
        - current_speed_arrow: true
          entity: sensor.izohor9_wind_speed
          name: Priemer
          output_speed_unit: kph
          output_speed_unit_label: km/h
          speed_range_beaufort: false
          speed_range_max: 60
          speed_range_step: 10
          windspeed_bar_full: true
        - entity: sensor.izohor9_wind_gust
          name: "N\xE1razy"
          output_speed_unit: kph
          output_speed_unit_label: km/h
          speed_range_beaufort: false
          speed_range_max: 80
          speed_range_step: 10
          windspeed_bar_full: true
      - apex_config:
          chart:
            height: 215
            toolbar:
              show: false
          grid:
            borderColor: var(--divider-color)
          legend:
            show: true
          stroke:
            curve: smooth
          xaxis:
            labels:
              datetimeUTC: false
        graph_span: 24h
        grid_options:
          columns: 6
          rows: 4
        header:
          colorize_states: true
          show: true
          show_states: true
          title: "UV a sol\xE1rna radi\xE1cia"
        now:
          label: Teraz
          show: true
        section_mode: true
        series:
        - color: '#ffb300'
          entity: sensor.izohor9_uv_index
          extend_to: now
          group_by:
            duration: 10min
            func: avg
          name: UV
          opacity: 0.2
          stroke_width: 3
          type: area
          yaxis_id: uv
        - color: '#ff6b35'
          entity: sensor.izohor9_solar_radiation
          extend_to: now
          group_by:
            duration: 10min
            func: avg
          name: "W/m\xB2"
          stroke_width: 2
          type: line
          yaxis_id: solar
        type: custom:apexcharts-card
        update_interval: 5min
        yaxis:
        - decimals: 0
          id: uv
          max: 12
          min: 0
        - decimals: 0
          id: solar
          min: 0
          opposite: true
      - apex_config:
          chart:
            height: 215
            toolbar:
              show: false
          grid:
            borderColor: var(--divider-color)
          stroke:
            curve: smooth
          xaxis:
            labels:
              datetimeUTC: false
        graph_span: 7d
        grid_options:
          columns: 6
          rows: 4
        header:
          colorize_states: true
          show: true
          show_states: true
          title: "Tlak vzduchu \xB7 7 dn\xED"
        now:
          label: Teraz
          show: true
        section_mode: true
        series:
        - color: '#7e57c2'
          entity: sensor.izohor9_pressure
          extend_to: now
          group_by:
            duration: 1h
            func: avg
          name: Tlak
          opacity: 0.16
          show:
            extremas: true
          stroke_width: 3
          type: area
        type: custom:apexcharts-card
        update_interval: 15min
        yaxis:
        - decimals: 0
          max: ~1040
          min: ~980
      - alignment: center
        chips:
        - content: '{{ states(''sensor.izohor9_precipitation_rate'') }} mm/h'
          entity: sensor.izohor9_precipitation_rate
          icon: mdi:weather-pouring
          icon_color: '{% set r = states(''sensor.izohor9_precipitation_rate'') |
            float(0) %} {% if r >= 10 %} red {% elif r > 0 %} blue {% else %} grey
            {% endif %}

            '
          tap_action:
            action: more-info
          type: template
        - content: Dnes {{ states('sensor.izohor9_precipitation_today') }} mm
          entity: sensor.izohor9_precipitation_today
          icon: mdi:cup-water
          icon_color: blue
          tap_action:
            action: more-info
          type: template
        - content: "{{ states('sensor.izohor9_solar_radiation') }} W/m\xB2"
          entity: sensor.izohor9_solar_radiation
          icon: mdi:solar-power
          icon_color: yellow
          tap_action:
            action: more-info
          type: template
        - content: Pozorovanie {{ states('sensor.izohor9_local_observation_time')
            }}
          entity: sensor.izohor9_local_observation_time
          icon: mdi:clock-outline
          icon_color: grey
          tap_action:
            action: more-info
          type: template
        grid_options:
          columns: full
          rows: 1
        type: custom:mushroom-chips-card
      column_span: 3
      type: grid
    title: Meteo
    type: sections
