config:
  title: "Bat\xE9rie"
  views:
  - icon: mdi:battery-alert-variant
    max_columns: 2
    path: baterie
    sections:
    - cards:
      - heading: "Stav bat\xE9ri\xED"
        icon: mdi:battery-heart-variant
        type: heading
      - cards:
        - fill_container: true
          icon: mdi:battery-alert
          icon_color: red
          layout: vertical
          primary: "{{ states.sensor\n   | selectattr('attributes.device_class','defined')\n\
            \   | selectattr('attributes.device_class','eq','battery')\n   | selectattr('state','is_number')\n\
            \   | map(attribute='state') | map('int') | select('lt',10) | list | count\
            \ }}"
          secondary: Kriticky (<10 %)
          type: custom:mushroom-template-card
        - fill_container: true
          icon: mdi:battery-30
          icon_color: orange
          layout: vertical
          primary: "{{ states.sensor\n   | selectattr('attributes.device_class','defined')\n\
            \   | selectattr('attributes.device_class','eq','battery')\n   | selectattr('state','is_number')\n\
            \   | map(attribute='state') | map('int') | select('lt',20) | list | count\
            \ }}"
          secondary: "N\xEDzke (<20 %)"
          type: custom:mushroom-template-card
        - fill_container: true
          icon: mdi:battery
          icon_color: green
          layout: vertical
          primary: "{{ states.sensor\n   | selectattr('attributes.device_class','defined')\n\
            \   | selectattr('attributes.device_class','eq','battery')\n   | list\
            \ | count }}"
          secondary: "Spolu zariaden\xED"
          type: custom:mushroom-template-card
        type: horizontal-stack
      column_span: 2
      type: grid
    - cards:
      - heading: "Vy\u017Eaduj\xFA pozornos\u0165"
        icon: mdi:battery-alert-variant-outline
        type: heading
      - card:
          state_color: true
          title: "\U0001F534 Kriticky n\xEDzke (< 10 %)"
          type: entities
        filter:
          include:
          - attributes:
              device_class: battery
            options:
              secondary_info: last-changed
            state: < 10
        show_empty: false
        sort:
          method: state
          numeric: true
          reverse: false
        type: custom:auto-entities
      - card:
          state_color: true
          title: "\U0001F7E0 N\xEDzke (10\u201320 %)"
          type: entities
        filter:
          exclude:
          - state: < 10
          include:
          - attributes:
              device_class: battery
            options:
              secondary_info: last-changed
            state: < 20
        show_empty: false
        sort:
          method: state
          numeric: true
          reverse: false
        type: custom:auto-entities
      - card:
          title: "\u26A0\uFE0F Hl\xE1sia \u201Eslab\xE1 bat\xE9ria\""
          type: entities
        filter:
          include:
          - attributes:
              device_class: battery
            domain: binary_sensor
            state: 'on'
        show_empty: false
        type: custom:auto-entities
      type: grid
    - cards:
      - heading: "V\u0161etky zariadenia"
        icon: mdi:format-list-bulleted
        type: heading
      - card:
          state_color: true
          title: "Bat\xE9rie \u2013 od najni\u017E\u0161ej"
          type: entities
        filter:
          exclude:
          - state: unavailable
          - state: unknown
          include:
          - attributes:
              device_class: battery
            domain: sensor
        sort:
          method: state
          numeric: true
          reverse: false
        type: custom:auto-entities
      type: grid
    title: "Bat\xE9rie"
    type: sections
