config:
  title: Futura
  views:
  - icon: mdi:fan
    max_columns: 3
    path: futura
    sections:
    - cards:
      - custom_fields:
          content: "[[[\n  const st = (e) => states[e]?.state ?? '-';\n  const num\
            \ = (e) => Number(states[e]?.state);\n\n  const airEntity = 'sensor.jablotron_futura_vzduchove_mnozstvi';\n\
            \  const powerEntity = 'sensor.jablotron_futura_prikon';\n  const filterEntity\
            \ = 'sensor.jablotron_futura_zaneseni_filtru';\n  const heatEntity = 'sensor.jablotron_futura_zpetne_ziskavane_teplo';\n\
            \  const modeEntity = 'select.jablotron_futura_rezim_vetrani';\n  const\
            \ errorEntity = 'binary_sensor.jablotron_futura_any_error';\n  const warningEntity\
            \ = 'binary_sensor.jablotron_futura_any_warning';\n\n  const co2Entities\
            \ = [\n    'sensor.jablotron_futura_senzor_1_co2',\n    'sensor.jablotron_futura_senzor_2_co2',\n\
            \    'sensor.jablotron_futura_senzor_3_co2',\n    'sensor.jablotron_futura_ui_ovladac_1_co2'\n\
            \  ];\n\n  const co2Values = co2Entities\n    .map(e => Number(states[e]?.state))\n\
            \    .filter(v => Number.isFinite(v));\n\n  const maxCo2 = co2Values.length\
            \ ? Math.max(...co2Values) : null;\n  const filter = num(filterEntity);\n\
            \  const hasError = states[errorEntity]?.state === 'on';\n  const hasWarning\
            \ = states[warningEntity]?.state === 'on';\n\n  const modeRaw = st(modeEntity);\n\
            \  const modeText = modeRaw === 'Auto' ? 'Automatika' : (modeRaw === 'Vypnuto'\
            \ ? 'Vypnut\xE9' : 'Stupe\u0148 ' + modeRaw + ' / 5');\n\n  let status\
            \ = 'Vzduch je v poriadku';\n  let statusClass = 'ok';\n\n  if (hasError)\
            \ {\n    status = 'Akt\xEDvna chyba syst\xE9mu';\n    statusClass = 'bad';\n\
            \  } else if (Number.isFinite(filter) && filter >= 90) {\n    status =\
            \ 'Filtre zanesen\xE9 \u2013 vymeni\u0165';\n    statusClass = 'bad';\n\
            \  } else if (maxCo2 !== null && maxCo2 > 1500) {\n    status = 'Ve\u013E\
            mi vysok\xE9 CO\u2082';\n    statusClass = 'bad';\n  } else if (Number.isFinite(filter)\
            \ && filter > 60) {\n    status = 'Filtre sa bl\xED\u017Eia k v\xFDmene';\n\
            \    statusClass = 'warn';\n  } else if (maxCo2 !== null && maxCo2 > 1000)\
            \ {\n    status = 'Zv\xFD\u0161en\xE9 CO\u2082';\n    statusClass = 'warn';\n\
            \  } else if (hasWarning) {\n    status = 'Akt\xEDvne varovanie';\n  \
            \  statusClass = 'warn';\n  }\n\n  const co2Text = maxCo2 === null ? '-'\
            \ : Math.round(maxCo2);\n\n  return `\n    <div class=\"futura-hero ${statusClass}\"\
            >\n      <div class=\"hero-top\">\n        <div class=\"hero-icon\">\n\
            \          <ha-icon icon=\"mdi:fan\"></ha-icon>\n        </div>\n    \
            \    <div class=\"hero-main\">\n          <div class=\"hero-title\">Futura</div>\n\
            \          <div class=\"hero-status\">${status}</div>\n        </div>\n\
            \      </div>\n\n      <div class=\"mode-pill\">\n        <ha-icon icon=\"\
            mdi:fan-auto\"></ha-icon>\n        <span>Re\u017Eim</span>\n        <strong>${modeText}</strong>\n\
            \      </div>\n\n      <div class=\"main-values\">\n        <div class=\"\
            main-metric\">\n          <div class=\"main-value\">${co2Text}</div>\n\
            \          <div class=\"main-label\">max CO\u2082 ppm</div>\n        </div>\n\
            \n        <div class=\"main-metric\">\n          <div class=\"main-value\"\
            >${st(airEntity)}</div>\n          <div class=\"main-label\">vzduch m\xB3\
            /h</div>\n        </div>\n      </div>\n\n      <div class=\"secondary-values\"\
            >\n        <div class=\"secondary-metric\">\n          <ha-icon icon=\"\
            mdi:flash\"></ha-icon>\n          <div>\n            <div class=\"secondary-value\"\
            >${st(powerEntity)} W</div>\n            <div class=\"secondary-label\"\
            >Pr\xEDkon</div>\n          </div>\n        </div>\n\n        <div class=\"\
            secondary-metric\">\n          <ha-icon icon=\"mdi:air-filter\"></ha-icon>\n\
            \          <div>\n            <div class=\"secondary-value\">${st(filterEntity)}\
            \ %</div>\n            <div class=\"secondary-label\">Filtre</div>\n \
            \         </div>\n        </div>\n\n        <div class=\"secondary-metric\
            \ wide\">\n          <ha-icon icon=\"mdi:heat-wave\"></ha-icon>\n    \
            \      <div>\n            <div class=\"secondary-value\">${st(heatEntity)}\
            \ W</div>\n            <div class=\"secondary-label\">Z\xEDskan\xE9 teplo</div>\n\
            \          </div>\n        </div>\n      </div>\n    </div>\n  `;\n]]]\n"
        entity: sensor.jablotron_futura_vzduchove_mnozstvi
        extra_styles: ".futura-hero {\n  min-height: 360px;\n  padding: 24px;\n  box-sizing:\
          \ border-box;\n  color: white;\n  display: flex;\n  flex-direction: column;\n\
          \  gap: 16px;\n  background: linear-gradient(135deg, #083344, #0369a1, #38bdf8);\n\
          }\n\n.futura-hero.ok {\n  background: linear-gradient(135deg, #083344, #0369a1,\
          \ #38bdf8);\n}\n\n.futura-hero.warn {\n  background: linear-gradient(135deg,\
          \ #92400e, #f59e0b, #fbbf24);\n}\n\n.futura-hero.bad {\n  background: linear-gradient(135deg,\
          \ #3b0d0d, #991b1b, #ef4444);\n}\n\n.hero-top {\n  display: flex;\n  align-items:\
          \ center;\n  gap: 16px;\n}\n\n.hero-icon {\n  width: 64px;\n  height: 64px;\n\
          \  border-radius: 22px;\n  display: flex;\n  align-items: center;\n  justify-content:\
          \ center;\n  background: rgba(255,255,255,0.20);\n  flex-shrink: 0;\n}\n\
          \n.hero-icon ha-icon {\n  --mdc-icon-size: 42px;\n  color: white;\n}\n\n\
          .hero-title {\n  font-size: 36px;\n  line-height: 1;\n  font-weight: 950;\n\
          }\n\n.hero-status {\n  margin-top: 8px;\n  font-size: 16px;\n  font-weight:\
          \ 850;\n  opacity: 0.96;\n}\n\n.mode-pill {\n  display: flex;\n  align-items:\
          \ center;\n  gap: 8px;\n  width: fit-content;\n  padding: 9px 13px;\n  border-radius:\
          \ 999px;\n  background: rgba(255,255,255,0.20);\n  font-size: 13px;\n  font-weight:\
          \ 750;\n}\n\n.mode-pill ha-icon {\n  --mdc-icon-size: 18px;\n  color: white;\n\
          }\n\n.mode-pill strong {\n  font-size: 15px;\n  font-weight: 950;\n}\n\n\
          .main-values {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0,\
          \ 1fr));\n  gap: 14px;\n}\n\n.main-metric {\n  border-radius: 24px;\n  padding:\
          \ 20px 16px;\n  background: rgba(255,255,255,0.22);\n  min-width: 0;\n}\n\
          \n.main-value {\n  font-size: 42px;\n  line-height: 1;\n  font-weight: 950;\n\
          \  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n\
          }\n\n.main-label {\n  margin-top: 10px;\n  font-size: 12px;\n  font-weight:\
          \ 850;\n  text-transform: uppercase;\n  letter-spacing: 0.07em;\n  opacity:\
          \ 0.92;\n}\n\n.secondary-values {\n  display: grid;\n  grid-template-columns:\
          \ repeat(2, minmax(0, 1fr));\n  gap: 12px;\n}\n\n.secondary-metric {\n \
          \ display: flex;\n  align-items: center;\n  gap: 12px;\n  border-radius:\
          \ 20px;\n  padding: 14px;\n  background: rgba(255,255,255,0.17);\n  min-width:\
          \ 0;\n}\n\n.secondary-metric.wide {\n  grid-column: 1 / -1;\n}\n\n.secondary-metric\
          \ ha-icon {\n  --mdc-icon-size: 28px;\n  color: white;\n  flex-shrink: 0;\n\
          }\n\n.secondary-value {\n  font-size: 22px;\n  line-height: 1;\n  font-weight:\
          \ 900;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n\
          }\n\n.secondary-label {\n  margin-top: 6px;\n  font-size: 12px;\n  font-weight:\
          \ 800;\n  text-transform: uppercase;\n  letter-spacing: 0.05em;\n  opacity:\
          \ 0.88;\n}\n"
        show_icon: false
        show_name: false
        show_state: false
        styles:
          card:
          - border-radius: 32px
          - padding: 0
          - overflow: hidden
          - min-height: 360px
          - box-shadow: 0 14px 36px rgba(0,0,0,0.20)
          custom_fields:
            content:
            - width: 100%
            - height: 100%
          grid:
          - grid-template-areas: '"content"'
          - grid-template-columns: 1fr
          - grid-template-rows: 1fr
        tap_action:
          action: more-info
        type: custom:button-card
      - heading: Miestnosti
        heading_style: title
        icon: mdi:home-analytics
        type: heading
      - card_mod:
          style: "ha-card {\n  border-radius: 26px;\n  overflow: hidden;\n  box-shadow:\
            \ 0 8px 24px rgba(0,0,0,0.12);\n}\n"
        cards:
        - card:
            icon: mdi:home-analytics
            icon_color: '{% set co2 = states(''sensor.jablotron_futura_senzor_1_co2'')|float(0)
              %} {{ ''red'' if co2 > 1500 else ''orange'' if co2 > 1000 else ''blue''
              }}

              '
            multiline_secondary: true
            primary: '{% set adr = states(''sensor.jablotron_futura_senzor_1_adresa'')
              %} Izba {{ adr if adr not in [''unknown'',''unavailable'',''''] else
              ''1'' }}

              '
            secondary: "CO\u2082: {{ states('sensor.jablotron_futura_senzor_1_co2')\
              \ }} ppm \xB7 Teplota: {{ states('sensor.jablotron_futura_senzor_1_teplota')\
              \ }} \xB0C \xB7 Vlhkos\u0165: {{ states('sensor.jablotron_futura_senzor_1_vlhkost')\
              \ }} %\n"
            type: custom:mushroom-template-card
          conditions:
          - entity: sensor.jablotron_futura_senzor_1_co2
            state_not: unavailable
          - entity: sensor.jablotron_futura_senzor_1_co2
            state_not: unknown
          type: conditional
        - card:
            icon: mdi:home-analytics
            icon_color: '{% set co2 = states(''sensor.jablotron_futura_senzor_2_co2'')|float(0)
              %} {{ ''red'' if co2 > 1500 else ''orange'' if co2 > 1000 else ''blue''
              }}

              '
            multiline_secondary: true
            primary: '{% set adr = states(''sensor.jablotron_futura_senzor_2_adresa'')
              %} Izba {{ adr if adr not in [''unknown'',''unavailable'',''''] else
              ''2'' }}

              '
            secondary: "CO\u2082: {{ states('sensor.jablotron_futura_senzor_2_co2')\
              \ }} ppm \xB7 Teplota: {{ states('sensor.jablotron_futura_senzor_2_teplota')\
              \ }} \xB0C \xB7 Vlhkos\u0165: {{ states('sensor.jablotron_futura_senzor_2_vlhkost')\
              \ }} %\n"
            type: custom:mushroom-template-card
          conditions:
          - entity: sensor.jablotron_futura_senzor_2_co2
            state_not: unavailable
          - entity: sensor.jablotron_futura_senzor_2_co2
            state_not: unknown
          type: conditional
        - card:
            icon: mdi:home-analytics
            icon_color: '{% set co2 = states(''sensor.jablotron_futura_senzor_3_co2'')|float(0)
              %} {{ ''red'' if co2 > 1500 else ''orange'' if co2 > 1000 else ''blue''
              }}

              '
            multiline_secondary: true
            primary: '{% set adr = states(''sensor.jablotron_futura_senzor_3_adresa'')
              %} Izba {{ adr if adr not in [''unknown'',''unavailable'',''''] else
              ''3'' }}

              '
            secondary: "CO\u2082: {{ states('sensor.jablotron_futura_senzor_3_co2')\
              \ }} ppm \xB7 Teplota: {{ states('sensor.jablotron_futura_senzor_3_teplota')\
              \ }} \xB0C \xB7 Vlhkos\u0165: {{ states('sensor.jablotron_futura_senzor_3_vlhkost')\
              \ }} %\n"
            type: custom:mushroom-template-card
          conditions:
          - entity: sensor.jablotron_futura_senzor_3_co2
            state_not: unavailable
          - entity: sensor.jablotron_futura_senzor_3_co2
            state_not: unknown
          type: conditional
        - card:
            icon: mdi:gesture-tap-button
            icon_color: '{% set co2 = states(''sensor.jablotron_futura_ui_ovladac_1_co2'')|float(0)
              %} {{ ''red'' if co2 > 1500 else ''orange'' if co2 > 1000 else ''blue''
              }}

              '
            multiline_secondary: true
            primary: "{% set adr = states('sensor.jablotron_futura_ui_ovladac_1_adresa')\
              \ %} Ovl\xE1da\u010D {{ adr if adr not in ['unknown','unavailable','']\
              \ else '1' }}\n"
            secondary: "CO\u2082: {{ states('sensor.jablotron_futura_ui_ovladac_1_co2')\
              \ }} ppm \xB7 Teplota: {{ states('sensor.jablotron_futura_ui_ovladac_1_teplota')\
              \ }} \xB0C \xB7 Vlhkos\u0165: {{ states('sensor.jablotron_futura_ui_ovladac_1_vlhkost')\
              \ }} %\n"
            type: custom:mushroom-template-card
          conditions:
          - entity: sensor.jablotron_futura_ui_ovladac_1_co2
            state_not: unavailable
          - entity: sensor.jablotron_futura_ui_ovladac_1_co2
            state_not: unknown
          type: conditional
        mode: vertical
        type: custom:stack-in-card
      type: grid
    - cards:
      - heading: "Ovl\xE1danie"
        heading_style: title
        icon: mdi:tune
        type: heading
      - card_mod:
          style: "ha-card {\n  border-radius: 24px;\n  box-shadow: 0 8px 24px rgba(0,0,0,0.10);\n\
            }\n"
        entity: select.jablotron_futura_rezim_vetrani
        fill_container: true
        icon: mdi:fan-auto
        name: "Re\u017Eim vetrania"
        type: custom:mushroom-select-card
      - cards:
        - card_mod:
            style: "ha-card {\n  border-radius: 24px;\n  background: linear-gradient(135deg,\
              \ rgba(14,165,233,0.16), rgba(59,130,246,0.08));\n}\n"
          fill_container: true
          hold_action:
            action: perform-action
            data:
              value: 0
            perform_action: number.set_value
            target:
              entity_id: number.jablotron_futura_boost_minuty
          icon: mdi:fan-plus
          icon_color: "{% if states('sensor.jablotron_futura_boost_zbyva_min')|int(0)\
            \ > 0 %}\n  blue\n{% else %}\n  grey\n{% endif %}\n"
          layout: vertical
          primary: Boost
          secondary: '{{ states(''sensor.jablotron_futura_boost_zbyva_min'') }} min'
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.jablotron_futura_spustit_boost_60_min
          type: custom:mushroom-template-card
        - card_mod:
            style: "ha-card {\n  border-radius: 24px;\n  background: linear-gradient(135deg,\
              \ rgba(14,165,233,0.16), rgba(59,130,246,0.08));\n}\n"
          fill_container: true
          hold_action:
            action: perform-action
            data:
              value: 0
            perform_action: number.set_value
            target:
              entity_id: number.jablotron_futura_cirkulace_minuty
          icon: mdi:autorenew
          icon_color: "{% if states('sensor.jablotron_futura_cirkulace_zbyva_min')|int(0)\
            \ > 0 %}\n  blue\n{% else %}\n  grey\n{% endif %}\n"
          layout: vertical
          primary: "Cirkul\xE1cia"
          secondary: '{{ states(''sensor.jablotron_futura_cirkulace_zbyva_min'') }}
            min'
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.jablotron_futura_spustit_cirkulaci_30_min
          type: custom:mushroom-template-card
        columns: 2
        square: false
        type: grid
      - heading: Nastavenia
        heading_style: subtitle
        icon: mdi:cog-outline
        type: heading
      - cards:
        - icon: mdi:thermometer-check
          icon_color: orange
          layout: vertical
          primary: Teplota
          secondary: "{{ states('number.jablotron_futura_pozadovana_teplota') }} \xB0\
            C"
          tap_action:
            action: more-info
            entity: number.jablotron_futura_pozadovana_teplota
          type: custom:mushroom-template-card
        - icon: mdi:water-check
          icon_color: cyan
          layout: vertical
          primary: "Vlhkos\u0165"
          secondary: '{{ states(''select.jablotron_futura_pozadovana_vlhkost'') }}'
          tap_action:
            action: more-info
            entity: select.jablotron_futura_pozadovana_vlhkost
          type: custom:mushroom-template-card
        - icon: mdi:weather-night
          icon_color: indigo
          layout: vertical
          primary: Noc
          secondary: '{{ states(''number.jablotron_futura_noc_hodiny'') }} h'
          tap_action:
            action: more-info
            entity: number.jablotron_futura_noc_hodiny
          type: custom:mushroom-template-card
        - icon: mdi:party-popper
          icon_color: blue
          layout: vertical
          primary: Party
          secondary: '{{ states(''number.jablotron_futura_party_hodiny'') }} h'
          tap_action:
            action: more-info
            entity: number.jablotron_futura_party_hodiny
          type: custom:mushroom-template-card
        columns: 2
        square: false
        type: grid
      - cards:
        - entity: switch.jablotron_futura_bypass_povolen
          icon: mdi:valve
          name: Bypass
          type: tile
        - entity: switch.jablotron_futura_casovy_program
          icon: mdi:calendar-clock
          name: Program
          type: tile
        - entity: switch.jablotron_futura_komfortni_rezim
          icon: mdi:sofa
          name: Komfort
          type: tile
        - entity: switch.jablotron_futura_topeni_povoleno
          icon: mdi:radiator
          name: "K\xFArenie"
          type: tile
        - entity: switch.jablotron_futura_chlazeni_povoleno
          icon: mdi:snowflake
          name: Chladenie
          type: tile
        columns: 1
        square: false
        type: grid
      - card:
          card_mod:
            style: "ha-card {\n  border-radius: 26px;\n  overflow: hidden;\n  background:\
              \ linear-gradient(135deg, rgba(14,165,233,0.16), rgba(59,130,246,0.08));\n\
              \  box-shadow: 0 8px 24px rgba(0,0,0,0.12);\n}\n"
          cards:
          - icon: mdi:beach
            icon_color: blue
            multiline_secondary: true
            primary: "Dovolenka je nastaven\xE1"
            secondary: 'Od {{ states(''sensor.jablotron_futura_dovolena_zacatek'')
              }} do {{ states(''sensor.jablotron_futura_dovolena_konec'') }}

              '
            type: custom:mushroom-template-card
          - icon: mdi:beach-off
            icon_color: grey
            primary: "Zru\u0161i\u0165 dovolenku"
            secondary: "Vypne dovolenkov\xFD re\u017Eim"
            tap_action:
              action: perform-action
              perform_action: jablotron_futura.clear_away
            type: custom:mushroom-template-card
          mode: vertical
          type: custom:stack-in-card
        conditions:
        - condition: state
          entity: binary_sensor.futura_dovolenka_aktivna
          state: 'on'
        type: conditional
      - card:
          card_mod:
            style: "ha-card {\n  border-radius: 24px;\n  background: linear-gradient(135deg,\
              \ rgba(14,165,233,0.16), rgba(59,130,246,0.08));\n  box-shadow: 0 8px\
              \ 24px rgba(0,0,0,0.10);\n}\n"
          icon: mdi:beach
          icon_color: blue
          primary: "Nastavi\u0165 dovolenku"
          secondary: "Dovolenka nie je nastaven\xE1"
          tap_action:
            action: perform-action
            perform_action: input_boolean.turn_on
            target:
              entity_id: input_boolean.futura_dovolenka_editor
          type: custom:mushroom-template-card
        conditions:
        - condition: state
          entity: binary_sensor.futura_dovolenka_aktivna
          state: 'off'
        - condition: state
          entity: input_boolean.futura_dovolenka_editor
          state: 'off'
        type: conditional
      - card:
          card_mod:
            style: "ha-card {\n  border-radius: 26px;\n  overflow: hidden;\n  background:\
              \ linear-gradient(135deg, rgba(14,165,233,0.16), rgba(59,130,246,0.08));\n\
              \  box-shadow: 0 8px 24px rgba(0,0,0,0.12);\n}\n"
          cards:
          - icon: mdi:calendar-edit
            icon_color: blue
            primary: "Nov\xE1 dovolenka"
            secondary: "Zadaj za\u010Diatok a koniec"
            type: custom:mushroom-template-card
          - card_mod:
              style: "ha-card {\n  --ha-card-border-width: 0;\n}\nha-card .card-content\
                \ {\n  padding: 8px 10px !important;\n}\nhui-input-datetime-entity-row\
                \ {\n  --mdc-typography-body1-font-size: 13px;\n}\nhui-input-datetime-entity-row\
                \ $ hui-generic-entity-row $ state-badge {\n  display: none;\n}\n\
                hui-input-datetime-entity-row $ hui-generic-entity-row $ .info {\n\
                \  margin-left: 0;\n  flex: 0 0 34px;\n  font-size: 12px;\n}\n"
            entities:
            - entity: input_datetime.futura_dovolenka_od
              name: Od
            - entity: input_datetime.futura_dovolenka_do
              name: Do
            show_header_toggle: false
            type: entities
          - cards:
            - icon: mdi:check-circle
              icon_color: green
              layout: vertical
              primary: "Potvrdi\u0165"
              secondary: "Zap\xEDsa\u0165 do jednotky"
              tap_action:
                action: perform-action
                perform_action: script.futura_nastavit_dovolenku
              type: custom:mushroom-template-card
            - icon: mdi:close-circle
              icon_color: grey
              layout: vertical
              primary: "Zru\u0161i\u0165"
              secondary: "Zavrie\u0165 bez zmeny"
              tap_action:
                action: perform-action
                perform_action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.futura_dovolenka_editor
              type: custom:mushroom-template-card
            columns: 2
            square: false
            type: grid
