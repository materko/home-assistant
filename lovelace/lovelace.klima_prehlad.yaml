          \ | float(0) %}\n{% set c = states('sensor.jablotron_futura_senzor_2_co2')\
          \ | float(0) %}\n{% set d = states('sensor.jablotron_futura_senzor_3_co2')\
          \ | float(0) %}\n{% set m = [a,b,c,d] | max %}\n{% if m == a %}Najvy\u0161\
          \u0161ie CO\u2082: Ob\xFDva\u010Dka \xB7 {{ m | round(0) }} ppm\n{% elif\
          \ m == b %}Najvy\u0161\u0161ie CO\u2082: Detsk\xE1 Mato \xB7 {{ m | round(0)\
          \ }} ppm\n{% elif m == c %}Najvy\u0161\u0161ie CO\u2082: Sp\xE1l\u0148a\
          \ \xB7 {{ m | round(0) }} ppm\n{% else %}Najvy\u0161\u0161ie CO\u2082: Detsk\xE1\
          \ Ena \xB7 {{ m | round(0) }} ppm\n{% endif %}\n"
