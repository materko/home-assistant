        icon_color: "{% set m = [\n  states('sensor.jablotron_futura_ui_ovladac_1_co2')\
          \ | float(0),\n  states('sensor.jablotron_futura_senzor_1_co2') | float(0),\n\
          \  states('sensor.jablotron_futura_senzor_2_co2') | float(0),\n  states('sensor.jablotron_futura_senzor_3_co2')\
          \ | float(0)\n] | max %} {% if m >= 1500 %}red {% elif m >= 1000 %}orange\
          \ {% elif m >= 800 %}yellow {% else %}green {% endif %}\n"
        multiline_secondary: true
        primary: "{% set a = states('sensor.jablotron_futura_ui_ovladac_1_co2') |\
          \ float(0) %} {% set b = states('sensor.jablotron_futura_senzor_1_co2')\
          \ | float(0) %} {% set c = states('sensor.jablotron_futura_senzor_2_co2')\
          \ | float(0) %} {% set d = states('sensor.jablotron_futura_senzor_3_co2')\
          \ | float(0) %} {% set m = [a,b,c,d] | max %} {% if m >= 1500 %}Zl\xE1 kvalita\
          \ vzduchu {% elif m >= 1000 %}Treba vyvetra\u0165 {% elif m >= 800 %}Vzduch\
          \ je mierne vyd\xFDchan\xFD {% else %}Kl\xEDma domu je v poriadku {% endif\
          \ %}\n"
        secondary: "{% set a = states('sensor.jablotron_futura_ui_ovladac_1_co2')\
