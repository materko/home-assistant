config:
  title: "Ostatn\xE9 \u2013 modern\xFD kompaktn\xFD preh\u013Ead"
  views:
  - cards:
    - card_mod:
        style: "ha-card {\n  border-radius: 26px;\n  overflow: hidden;\n  border:\
          \ 1px solid rgba(var(--rgb-primary-text-color), 0.08);\n  box-shadow: 0\
          \ 8px 24px rgba(0,0,0,0.06);\n}"
      cards:
      - card_mod:
          style: "ha-card {\n  min-height: 118px;\n  border-radius: 24px;\n  background:\
            \ linear-gradient(\n    135deg,\n    rgba(var(--rgb-primary-color), 0.18),\n\
            \    rgba(var(--rgb-primary-color), 0.04)\n  );\n  border: 1px solid rgba(var(--rgb-primary-color),\
            \ 0.16);\n  box-shadow: none;\n}"
        hold_action:
          action: none
        icon: mdi:view-dashboard-variant-outline
        icon_color: "{% if is_state('switch.0x0c4314fffe54b0b0', 'on')\n      or is_state('switch.ir_switch_light_big',\
          \ 'on')\n      or is_state('switch.ir_switch_light_small', 'on') %}blue{%\
          \ else %}green{% endif %}"
        multiline_secondary: true
        primary: "Ostatn\xE9 zariadenia"
        secondary: "{% set l = state_attr('cover.curtain_3_f881', 'current_position')\
          \ | int(0) %}\n{% set r = state_attr('cover.curtain_3_abc6', 'current_position')\
          \ | int(0) %}\n{% set lights = (1 if is_state('switch.ir_switch_light_big',\
          \ 'on') else 0) + (1 if is_state('switch.ir_switch_light_small', 'on') else\
          \ 0) %}\nZ\xE1vesy {{ ((l + r) / 2) | round(0) }} % \xB7 IR svetl\xE1 {{\
          \ lights }}/2\nTla\u010Diare\u0148 {{ 'zapnut\xE1' if is_state('switch.0x0c4314fffe54b0b0',\
          \ 'on') else 'vypnut\xE1' }}"
        tap_action:
          action: none
        type: custom:mushroom-template-card
      - alignment: justify
        chips:
        - content: "\u013D {{ state_attr('cover.curtain_3_f881', 'current_position')\
            \ | int(0) }} %"
          entity: cover.curtain_3_f881
          icon: mdi:curtains
          icon_color: blue
          tap_action:
            action: more-info
          type: template
        - content: P {{ state_attr('cover.curtain_3_abc6', 'current_position') | int(0)
            }} %
          entity: cover.curtain_3_abc6
          icon: mdi:curtains
          icon_color: blue
          tap_action:
            action: more-info
          type: template
        - content: "{{ 'Zapnut\xE1' if is_state('switch.0x0c4314fffe54b0b0', 'on')\
            \ else 'Vypnut\xE1' }}"
          entity: switch.0x0c4314fffe54b0b0
          icon: mdi:printer
          icon_color: '{% if is_state(''switch.0x0c4314fffe54b0b0'', ''on'') %}blue{%
            else %}grey{% endif %}'
          tap_action:
            action: toggle
          type: template
        - content: "{{ (1 if is_state('switch.ir_switch_light_big', 'on') else 0)\
            \ +\n                       (1 if is_state('switch.ir_switch_light_small',\
            \ 'on') else 0) }}/2"
          icon: mdi:lightbulb-group-outline
          icon_color: '{% if is_state(''switch.ir_switch_light_big'', ''on'') or is_state(''switch.ir_switch_light_small'',
            ''on'') %}blue{% else %}grey{% endif %}'
          tap_action:
            action: none
          type: template
        type: custom:mushroom-chips-card
      keep:
        background: false
        border_radius: false
        box_shadow: false
        margin: false
      mode: vertical
      type: custom:stack-in-card
    - card_mod:
        style: "ha-card {\n  border-radius: 26px;\n  overflow: hidden;\n  border:\
          \ 1px solid rgba(var(--rgb-primary-text-color), 0.08);\n  box-shadow: 0\
          \ 8px 24px rgba(0,0,0,0.06);\n}"
      cards:
      - alignment: start
        subtitle: "Presn\xE9 ovl\xE1danie polohy oboch str\xE1n"
        title: "Z\xE1vesy"
        type: custom:mushroom-title-card
      - hold_action:
          action: none
        icon: mdi:curtains
        icon_color: '{% set l = state_attr(''cover.curtain_3_f881'', ''current_position'')
          | int(0) %}

          {% set r = state_attr(''cover.curtain_3_abc6'', ''current_position'') |
          int(0) %}

          {% if (l-r) | abs > 10 %}orange{% elif l <= 10 and r <= 10 %}grey{% else
          %}blue{% endif %}'
        primary: "{% set l = state_attr('cover.curtain_3_f881', 'current_position')\
          \ | int(0) %}\n{% set r = state_attr('cover.curtain_3_abc6', 'current_position')\
          \ | int(0) %}\n{% if (l-r) | abs > 10 %}Z\xE1vesy nie s\xFA zarovno\n{%\
          \ elif l >= 90 and r >= 90 %}Z\xE1vesy s\xFA otvoren\xE9\n{% elif l <= 10\
          \ and r <= 10 %}Z\xE1vesy s\xFA zatiahnut\xE9\n{% else %}Z\xE1vesy s\xFA\
          \ \u010Diasto\u010Dne otvoren\xE9{% endif %}"
        secondary: "\u013Dav\xFD {{ state_attr('cover.curtain_3_f881', 'current_position')\
          \ | int(0) }} % \xB7 prav\xFD {{ state_attr('cover.curtain_3_abc6', 'current_position')\
          \ | int(0) }} %"
        tap_action:
          action: none
        type: custom:mushroom-template-card
      - cards:
        - card_mod:
            style: "ha-card {\n  min-height: 184px;\n  border-radius: 20px;\n  box-shadow:\
              \ none;\n}"
          entity: cover.curtain_3_f881
          fill_container: true
          hold_action:
            action: more-info
          icon: mdi:curtains
          layout: vertical
          name: "\u013Dav\xFD z\xE1ves"
          show_buttons_control: true
          show_position_control: true
          tap_action:
            action: more-info
          type: custom:mushroom-cover-card
        - card_mod:
            style: "ha-card {\n  min-height: 184px;\n  border-radius: 20px;\n  box-shadow:\
              \ none;\n}"
          entity: cover.curtain_3_abc6
          fill_container: true
          hold_action:
            action: more-info
          icon: mdi:curtains
          layout: vertical
          name: "Prav\xFD z\xE1ves"
          show_buttons_control: true
          show_position_control: true
          tap_action:
            action: more-info
          type: custom:mushroom-cover-card
        columns: 2
        square: false
        type: grid
      - alignment: justify
        chips:
        - content: "Otvori\u0165"
          icon: mdi:curtains
          icon_color: blue
          tap_action:
            action: perform-action
            perform_action: cover.open_cover
            target:
              entity_id:
              - cover.curtain_3_f881
              - cover.curtain_3_abc6
          type: template
        - content: 50 %
          icon: mdi:circle-half-full
          icon_color: orange
          tap_action:
            action: perform-action
            data:
              position: 50
            perform_action: cover.set_cover_position
            target:
              entity_id:
              - cover.curtain_3_f881
              - cover.curtain_3_abc6
          type: template
        - content: Stop
          icon: mdi:stop-circle-outline
          icon_color: grey
          tap_action:
            action: perform-action
            perform_action: cover.stop_cover
            target:
              entity_id:
              - cover.curtain_3_f881
              - cover.curtain_3_abc6
          type: template
        - content: "Zatiahnu\u0165"
          icon: mdi:curtains-closed
          icon_color: grey
          tap_action:
            action: perform-action
            perform_action: cover.close_cover
            target:
              entity_id:
              - cover.curtain_3_f881
              - cover.curtain_3_abc6
          type: template
        type: custom:mushroom-chips-card
      - alignment: start
        chips:
        - content: "\u013D {{ states('sensor.curtain_3_f881_battery') }} %"
          entity: sensor.curtain_3_f881_battery
          icon: mdi:battery
          icon_color: '{% set b = states(''sensor.curtain_3_f881_battery'') %}

            {% if b in [''unknown'',''unavailable''] %}grey{% elif b|float < 20 %}red{%
            elif b|float < 40 %}orange{% else %}green{% endif %}'
          tap_action:
            action: more-info
          type: template
        - content: P {{ states('sensor.curtain_3_abc6_battery') }} %
          entity: sensor.curtain_3_abc6_battery
          icon: mdi:battery
          icon_color: '{% set b = states(''sensor.curtain_3_abc6_battery'') %}

            {% if b in [''unknown'',''unavailable''] %}grey{% elif b|float < 20 %}red{%
            elif b|float < 40 %}orange{% else %}green{% endif %}'
          tap_action:
            action: more-info
          type: template
        - content: "\u013D {{ states('sensor.curtain_3_f881_light_level') }}"
          entity: sensor.curtain_3_f881_light_level
          icon: mdi:brightness-6
          icon_color: yellow
          tap_action:
            action: more-info
          type: template
        - content: P {{ states('sensor.curtain_3_abc6_light_level') }}
          entity: sensor.curtain_3_abc6_light_level
          icon: mdi:brightness-6
          icon_color: yellow
          tap_action:
            action: more-info
          type: template
        type: custom:mushroom-chips-card
      keep:
        background: false
        border_radius: false
        box_shadow: false
        margin: false
      mode: vertical
      type: custom:stack-in-card
    - card_mod:
        style: "ha-card {\n  border-radius: 26px;\n  overflow: hidden;\n  border:\
