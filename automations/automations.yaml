- id: '1786272376733'
  alias: Kamery – nahrať klip pri pohybe
  description: Pri pohybe uloží snímku do /media/kamery/<kamera>/ a potom stiahne z NVR klip s rovnakým názvom. Celková dĺžka
    klipu je input_number.kamery_dlzka_klipu_alarmu a z nej pripadá na pred-záznam pred triggerom input_number.kamery_predzaznam_alarmu
    — zvyšok je po triggeri. Klip sa berie zo záznamu na NVR, nie zo živého streamu, takže pred-záznam funguje bez Preload
    stream. NVR sprístupňuje čerstvý záznam v skokoch a zaostáva niekoľko minút, preto sa sťahovanie skúša každé 2 minúty,
    najviac desaťkrát, a po prvom úspechu sa beh ukončí. Snímka je teda hneď, klip do niekoľkých minút.
  triggers:
  - entity_id: binary_sensor.vchod_motion
    id: vchod
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.entry_motion
    id: entry
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.terrace_motion
    id: terrace
    to: 'on'
    trigger: state
  actions:
  - alias: Podľa kamery uložiť snímku a stiahnuť klip z NVR
    choose:
    - conditions:
      - condition: trigger
        id: vchod
      sequence:
      - action: camera.snapshot
        data:
          filename: /media/kamery/vchod/{{ ts }}.jpg
        target:
          entity_id: camera.vchod_fluent
      - repeat:
          count: 10
          sequence:
          - delay: 00:02:00
          - action: reolink.vod_download
            data:
              device_id: 0c2e897d77663aa13278f5e16cb0008a
              timestamp: '{{ moment }}'
              pre_roll: '{{ pre_roll }}'
              duration: '{{ clip_duration }}'
              filename: /media/kamery/vchod/{{ ts }}.mp4
            response_variable: clip
            continue_on_error: true
          - if:
            - '{{ clip is defined }}'
            then:
            - stop: Klip stiahnutý
        note: NVR sprístupní čerstvý úsek až po niekoľkých minútach, preto opakované pokusy.
    - conditions:
      - condition: trigger
        id: entry
      sequence:
      - action: camera.snapshot
        data:
          filename: /media/kamery/entry/{{ ts }}.jpg
        target:
          entity_id: camera.entry_fluent
      - repeat:
          count: 10
          sequence:
          - delay: 00:02:00
          - action: reolink.vod_download
            data:
              device_id: f22d37e31b34a230ba40651f7289fc55
              timestamp: '{{ moment }}'
              pre_roll: '{{ pre_roll }}'
              duration: '{{ clip_duration }}'
              filename: /media/kamery/entry/{{ ts }}.mp4
            response_variable: clip
            continue_on_error: true
          - if:
            - '{{ clip is defined }}'
            then:
            - stop: Klip stiahnutý
        note: NVR sprístupní čerstvý úsek až po niekoľkých minútach, preto opakované pokusy.
    - conditions:
      - condition: trigger
        id: terrace
      sequence:
      - action: camera.snapshot
        data:
          filename: /media/kamery/terrace/{{ ts }}.jpg
        target:
          entity_id: camera.terrace_fluent
      - repeat:
          count: 10
          sequence:
          - delay: 00:02:00
          - action: reolink.vod_download
            data:
              device_id: b0a7ce8a1c7bd41a2003af7a2f039de2
              timestamp: '{{ moment }}'
              pre_roll: '{{ pre_roll }}'
              duration: '{{ clip_duration }}'
              filename: /media/kamery/terrace/{{ ts }}.mp4
            response_variable: clip
            continue_on_error: true
          - if:
            - '{{ clip is defined }}'
            then:
            - stop: Klip stiahnutý
        note: NVR sprístupní čerstvý úsek až po niekoľkých minútach, preto opakované pokusy.
  variables:
    ts: '{{ now().strftime(''%Y-%m-%d_%H-%M-%S'') }}'
    moment: '{{ as_local(trigger.to_state.last_changed).isoformat() }}'
    pre_roll: '{{ states(''input_number.kamery_predzaznam_alarmu'') | int(8) }}'
    clip_duration: '{{ states(''input_number.kamery_dlzka_klipu_alarmu'') | int(38) }}'
  max: 25
  mode: parallel
- id: '1786272460944'
  alias: Kamery – zmazať staré klipy
  description: 'Denne o 03:30 spustí shell_command.kamery_cleanup, ktorý zmaže klipy a snímky staršie ako 14 dní z /media/kamery/.
    POZOR: vyžaduje shell_command definovaný v configuration.yaml – kým tam nie je, táto automatizácia bude každú noc hádzať
    chybu ''Service not found''. Retenciu meniť v tom shell_command (-mtime +14).'
  triggers:
  - at: 03:30:00
    trigger: time
  actions:
  - action: shell_command.kamery_cleanup
    alias: Zmazať súbory staršie ako 14 dní
  mode: single
- id: '1767011552905'
  alias: Kupelka dole VYPNUT svetlo po 10min
  description: Tretia vrstva – posledná poistka. Ak svetlo svieti 10 minút a occupancy senzor po celú tú dobu hlási prázdno,
    zhasne. Kryje prípad, keď zlyhajú obe predchádzajúce vrstvy. Prepísané z device_id na entity_id.
  triggers:
  - entity_id: switch.0x54ef44100139126d_left
    for:
      hours: 0
      minutes: 10
      seconds: 0
    to: 'on'
    trigger: state
  - entity_id: switch.0x54ef44100139126d_right
    for:
      hours: 0
      minutes: 10
      seconds: 0
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: binary_sensor.0x54ef441001496af8_presence
    for:
      hours: 0
      minutes: 10
      seconds: 0
    state: 'off'
  actions:
  - action: switch.turn_off
    alias: Zhasnúť obe svetlá
    target:
      entity_id:
      - switch.0x54ef44100139126d_left
      - switch.0x54ef44100139126d_right
  mode: single
- id: '1766593894960'
  alias: Kupelka dole VYPNUTIE svetla
  description: 'Druhá vrstva ochrany: zhasne svetlá, keď occupancy senzor hlási 30 s bez prítomnosti. Kryje prípad, keď zlyhá
    prvá vrstva (automatizacia ZAPNUTIE svetla AI). Prepísané z device_id na entity_id.'
  triggers:
  - entity_id: binary_sensor.0x54ef441001496af8_presence
    for:
      hours: 0
      minutes: 0
      seconds: 30
    to: 'off'
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: switch.0x54ef44100139126d_left
      state: 'on'
    - condition: state
      entity_id: switch.0x54ef44100139126d_right
      state: 'on'
  actions:
  - action: switch.turn_off
    alias: Zhasnúť obe svetlá
    target:
      entity_id:
      - switch.0x54ef44100139126d_left
      - switch.0x54ef44100139126d_right
  mode: single
- id: '1767186942879'
  alias: Kupelka dole ZAPNUTIE svetla AI
  description: 'Prva vrstva: PIR zapne svetlo, potom sa caka max 1:45 na occupancy (niekto tam naozaj je -> svetlo zostava)
    alebo na PIR off na 1 min (-> zhasnut). Ak sa nedocka niceho, po timeoute tiez zhasne.'
  triggers:
  - entity_id:
    - binary_sensor.0x54ef441001496af8_pir_detection
    to:
    - 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: switch.0x54ef44100139126d_left
    state:
    - 'off'
  actions:
  - action: switch.turn_on
    data: {}
    target:
      entity_id:
      - switch.0x54ef44100139126d_left
  - continue_on_timeout: true
    timeout:
      hours: 0
      milliseconds: 0
      minutes: 1
      seconds: 45
    wait_for_trigger:
    - entity_id:
      - binary_sensor.0x54ef441001496af8_presence
      to:
      - 'on'
      trigger: state
    - entity_id:
      - binary_sensor.0x54ef441001496af8_pir_detection
      for:
        hours: 0
        minutes: 1
        seconds: 0
      to:
