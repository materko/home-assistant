# Automatizacie z Home Assistant (.storage/automations -> automations.yaml)
# Export cez API. Format je identicky s /config/automations.yaml,
# takze subor sa da pri obnove nakopirovat priamo.
# Pocet: 43

- id: '1782584619788'
  alias: Bazen - Push pool screen to e-paper
  description: Kazde 3 minuty vykresli prehlad bazena do HTML a posle ho cez rest_command.trmnl_screen na e-paper displej.
    Entity prefixy aktualizovane na bazen_aseko_* po premenovani.
  triggers:
  - trigger: time_pattern
    minutes: /3
  - trigger: state
    entity_id:
    - sensor.bazen_aseko_asin_aqua_salt_110195262_connection_status
  actions:
  - variables:
      ph: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_ph'') }}'
      ph_n: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_ph'') | float(0) }}'
      redox: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_redox_potential'') }}'
      redox_n: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_redox_potential'') | int(0) }}'
      temp: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_water_temperature'') }}'
      salt: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_salinity'') }}'
      salt_n: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_salinity'') | float(0) }}'
      level: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_water_level'') }}'
      flow: '{{ is_state(''binary_sensor.bazen_aseko_asin_aqua_salt_110195262_water_flow_to_probes'', ''on'') }}'
      filt: '{{ is_state(''binary_sensor.bazen_aseko_asin_aqua_salt_110195262_filtration_pump_running'', ''on'') }}'
      filt_from: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_filtration_1_start'') }}'
      filt_to: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_filtration_1_stop'') }}'
      e_power: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_electrolyzer_power'') }}'
      e_dir_raw: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_electrolyzer_direction'') }}'
      e_dir: '{{ {''left'':''vľavo'',''right'':''vpravo'',''waiting'':''čaká''}.get(e_dir_raw, e_dir_raw) }}'
      ph_target: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_required_ph_value'') }}'
      redox_target: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_required_redox_potential'') }}'
      ph_warn: '{{ ph_n < 6.8 or ph_n > 7.6 }}'
      redox_warn: '{{ redox_n < 500 }}'
      salt_warn: '{{ salt_n < 2.5 or salt_n > 5.5 }}'
      conn: '{{ states(''sensor.bazen_aseko_asin_aqua_salt_110195262_connection_status'') }}'
      online: '{{ conn == ''online'' }}'
      markup: |
        <!DOCTYPE html> <html> <head>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        </head> <body style="margin:0;padding:0;font-family:Inter,sans-serif;"> <div style="width:800px;height:480px;box-sizing:border-box;border:3px solid #000;display:flex;flex-direction:column;color:#000;">

          <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #000;padding:10px 18px;">
            <span style="font-size:24px;font-weight:700;">Bazén — Aseko ASIN Aqua Salt</span>
            {% if online %}
            <span style="font-size:17px;font-weight:600;">{{ now().strftime('%H:%M') }} · online</span>
            {% else %}
            <span style="font-size:17px;font-weight:700;background:#000;color:#fff;padding:6px 14px;">{{ now().strftime('%H:%M') }} · OFFLINE</span>
            {% endif %}
          </div>

          <div style="flex:1;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;grid-template-rows:1fr 1fr;">

            <div style="border-bottom:3px solid #000;border-right:3px solid #000;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;">
              <span style="font-size:17px;font-weight:600;">pH vody</span>
              <span style="font-size:78px;font-weight:700;line-height:1;align-self:flex-start;{% if ph_warn %}background:#000;color:#fff;padding:2px 10px;{% endif %}">{{ ph }}</span>
              <span style="font-size:13px;font-weight:600;">cieľ {{ ph_target }}</span>
            </div>

            <div style="border-bottom:3px solid #000;border-right:3px solid #000;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;">
              <span style="font-size:17px;font-weight:600;">Redox</span>
              <span style="font-size:78px;font-weight:700;line-height:1;white-space:nowrap;align-self:flex-start;{% if redox_warn %}background:#000;color:#fff;padding:2px 10px;{% endif %}">{{ redox }}<span style="font-size:26px;font-weight:600;">mV</span></span>
              <span style="font-size:13px;font-weight:600;">cieľ {{ redox_target }} mV</span>
            </div>

            <div style="border-bottom:3px solid #000;border-right:3px solid #000;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;">
              <span style="font-size:17px;font-weight:600;">Teplota</span>
              <span style="font-size:78px;font-weight:700;line-height:1;white-space:nowrap;">{{ temp }}<span style="font-size:26px;font-weight:600;">°C</span></span>
            </div>

            <div style="border-bottom:3px solid #000;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;">
              <span style="font-size:17px;font-weight:600;">Salinita</span>
              <span style="font-size:78px;font-weight:700;line-height:1;white-space:nowrap;align-self:flex-start;{% if salt_warn %}background:#000;color:#fff;padding:2px 10px;{% endif %}">{{ salt }}<span style="font-size:20px;font-weight:600;">kg/m³</span></span>
            </div>

            <div style="border-right:3px solid #000;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;">
              <span style="font-size:17px;font-weight:600;">Elektrolyzér</span>
              <span style="font-size:78px;font-weight:700;line-height:1;white-space:nowrap;">{{ e_power }}<span style="font-size:20px;font-weight:600;">g/h</span></span>
              <span style="font-size:13px;font-weight:600;">smer {{ e_dir }}</span>
            </div>

            <div style="border-right:3px solid #000;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;">
              <span style="font-size:17px;font-weight:600;">Prietok k sondám</span>
              {% if not filt %}<span style="font-size:78px;font-weight:700;line-height:1;">—</span>
              <span style="font-size:13px;font-weight:600;">filtrácia stojí</span>
              {% elif flow %}<span style="font-size:78px;font-weight:700;line-height:1;">ÁNO</span>
              {% else %}<span style="font-size:78px;font-weight:700;line-height:1;background:#000;color:#fff;padding:2px 12px;align-self:flex-start;">NIE</span>{% endif %}
            </div>

            <div style="border-right:3px solid #000;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;">
              <span style="font-size:17px;font-weight:600;">Hladina vody</span>
              <span style="font-size:78px;font-weight:700;line-height:1;white-space:nowrap;">{{ level }}<span style="font-size:26px;font-weight:600;">cm</span></span>
            </div>

            <div style="padding:10px 14px;"></div>

          </div>

          <div style="display:flex;border-top:3px solid #000;">
            <div style="flex:1;padding:10px 18px;border-right:3px solid #000;display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:18px;font-weight:600;">Filtrácia</span>
              {% if filt %}<span style="font-size:20px;font-weight:700;border:3px solid #000;padding:2px 12px;">BEŽÍ</span>{% else %}<span style="font-size:20px;font-weight:700;background:#000;color:#fff;padding:4px 14px;">STOP</span>{% endif %}
            </div>
            <div style="flex:1;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:18px;font-weight:600;">Čas filtrácie</span>
              <span style="font-size:20px;font-weight:700;">{{ filt_from }} – {{ filt_to }}</span>
            </div>
          </div>

        </div> </body> </html>
  - action: rest_command.trmnl_screen
    data:
      markup: '{{ markup }}'
- id: bazen_zapis_posledne_dopustanie
  alias: Bazén - zapíš posledné dopúšťanie vody
  description: Zaznamená čas, keď sa naposledy začala dopúšťať voda. Binary sensor si po reštarte HA prepíše last_changed
    časom reštartu, takže sa naň nedá spoľahnúť — tento helper prežije reštart.
  triggers:
  - trigger: state
    entity_id: binary_sensor.bazen_aseko_asin_aqua_salt_110195262_water_filling_active
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.bazen_posledne_dopustanie_vody
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  mode: single
- id: bazen_zapis_trvanie_dopustania
  alias: Bazén - zapíš trvanie dopúšťania
  description: Keď dopúšťanie skončí, spočíta ako dlho trvalo z času, kedy binary sensor prešiel do on. Recorder to vie len
    10 dní dozadu, tento helper si to pamätá natrvalo.
  triggers:
  - trigger: state
    entity_id: binary_sensor.bazen_aseko_asin_aqua_salt_110195262_water_filling_active
    from: 'on'
    to: 'off'
  conditions: []
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.bazen_trvanie_posledneho_dopustania
    data:
      value: '{{ ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed)) / 60) | round(1)
        }}'
  mode: single
- id: '1769641124907'
